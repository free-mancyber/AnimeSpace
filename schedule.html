<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeSpace — Расписание</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="logo-link" href="index.html"><img class="logo" src="image.png" alt="AnimeSpace"></a><nav class="nav"><a href="index.html"><span class="icon">⌂</span>Главное</a><a class="active" href="schedule.html"><span class="icon">▣</span>Расписание</a><a href="top100.html"><span class="icon">↗</span>Топ 100</a><a href="search.html"><span class="icon">⌕</span>Поиск</a><a href="profile.html"><span class="icon">♙</span>Профиль</a></nav></header><main class="page"><div class="page-inner"><h1 class="page-title">Расписание</h1><div class="schedule-search"><input id="q" class="input" placeholder="Найти аниме в расписании..."><button class="main-btn" onclick="render(activeDay)">Найти</button></div><div class="days" id="days"></div><div class="schedule-grid" id="grid"></div></div></main><script src="app.js"></script><script>const data={Пн:['Понедельник: Аниме 1','Понедельник: Аниме 2','Понедельник: Аниме 3','Понедельник: Аниме 4','Понедельник: Аниме 5','Понедельник: Аниме 6'],Вт:['Вторник: Аниме 1','Вторник: Аниме 2','Вторник: Аниме 3','Вторник: Аниме 4','Вторник: Аниме 5','Вторник: Аниме 6'],Ср:['Среда: Аниме 1','Среда: Аниме 2','Среда: Аниме 3','Среда: Аниме 4','Среда: Аниме 5','Среда: Аниме 6'],Чт:['Четверг: Аниме 1','Четверг: Аниме 2','Четверг: Аниме 3','Четверг: Аниме 4','Четверг: Аниме 5','Четверг: Аниме 6'],Пт:['Пятница: Аниме 1','Пятница: Аниме 2','Пятница: Аниме 3','Пятница: Аниме 4','Пятница: Аниме 5','Пятница: Аниме 6'],Сб:['Суббота: Аниме 1','Суббота: Аниме 2','Суббота: Аниме 3','Суббота: Аниме 4','Суббота: Аниме 5','Суббота: Аниме 6'],Вс:['Воскресенье: Аниме 1','Воскресенье: Аниме 2','Воскресенье: Аниме 3','Воскресенье: Аниме 4','Воскресенье: Аниме 5','Воскресенье: Аниме 6']};const names=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];let activeDay=names[(new Date().getDay()+6)%7];names.forEach(d=>{const b=document.createElement('button');b.className='day-btn';b.textContent=d;b.onclick=()=>{activeDay=d;render(d)};document.getElementById('days').appendChild(b)});function render(day){document.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('active',b.textContent===day));const q=document.getElementById('q').value.trim().toLowerCase();const list=(data[day]||[]).filter(x=>!q||x.toLowerCase().includes(q));document.getElementById('grid').innerHTML=list.length?list.map((name,i)=>{const anime={title:name,rating:'—',image:images[i%images.length]};return `<article class="schedule-card" data-anime='${encodeURIComponent(JSON.stringify(anime))}'><img src="${anime.image}" alt="${esc(name)}"><div class="schedule-info"><div class="schedule-name">${esc(name)}</div><div class="schedule-meta">Серия ${i+1} · ${18+i}:00</div><div class="schedule-status">${i%2?'Скоро':'Вышло'}</div></div></article>`}).join(''):'<div class="empty">Аниме по вашему запросу не найдено.</div>'}render(activeDay)</script></body></html>

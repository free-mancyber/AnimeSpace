<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeSpace — Расписание</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="header.css"></head><body><header class="topbar"><a class="logo-link" href="index.html"><img class="logo" src="image.png" alt="AnimeSpace"></a><nav class="nav"><a href="index.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8M5.5 9.5V21h13V9.5M9.5 21v-6h5v6"/></svg></span>Главное</a><a class="active" href="schedule.html"><span class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span>Расписание</a><a href="top100.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 17 9 12l4 3 7-8M17 7h3v3M4 20h16"/></svg></span>Топ 100</a><a href="search.html"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></span>Поиск</a><a class="profile-nav" id="profileNav" href="profile.html"><span class="icon" id="profileNavIcon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c.7-4 3.1-6 7 6"/></svg></span><span id="profileNavText" class="profile-nav-text">Профиль</span></a></nav></header><main class="page"><div class="page-inner"><h1 class="page-title">Расписание</h1><div class="schedule-search"><input id="q" class="input" placeholder="Найти аниме в расписании..."><button class="main-btn" onclick="renderSchedule()">Найти</button></div><div class="days" id="days"></div><div class="schedule-grid" id="grid"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=20260913-11"></script><script>const names=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];let activeDay=names[(new Date().getDay()+6)%7];window.animeSpaceSchedule=[];names.forEach(d=>{const b=document.createElement('button');b.className='day-btn';b.textContent=d;b.onclick=()=>{activeDay=d;renderSchedule()};document.getElementById('days').appendChild(b)});function dayKey(d){return names.indexOf(d)}function renderSchedule(){const grid=document.getElementById('grid');document.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('active',b.textContent===activeDay));const q=document.getElementById('q').value.trim().toLowerCase();const list=window.animeSpaceSchedule.filter(x=>x.weekday===dayKey(activeDay)&&(!q||String(x.title||'').toLowerCase().includes(q)));grid.innerHTML=list.length?list.map(a=>`<article class="anime-card schedule-anime-card" data-anime='${packAnime(a)}'><div class="anime-card-poster"><img src="${esc(a.image)}" alt="${esc(a.title)}" loading="lazy" onerror="this.onerror=null;this.style.visibility='hidden'"><div class="anime-card-rating"><span class="anime-card-star">★</span><span class="anime-card-rating-value">${esc(a.rating||'—')}</span></div></div><div class="anime-card-title">${esc(a.title)}</div><div class="anime-card-meta">${a.episode?'Серия '+esc(a.episode):'Новая серия'}${a.time?' • '+new Date(a.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):''} • ${esc(a.status||'Выходит')}</div></article>`).join(''):'<div class="empty">Аниме по вашему запросу не найдено.</div>'}async function loadSchedule(){try{const r=await fetch('https://anilibria.top/api/v1/anime/schedule/week?_= '+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Schedule API: '+r.status);const body=await r.json();const raw=Array.isArray(body?.data)?body.data:(Array.isArray(body)?body:[]);window.animeSpaceSchedule=raw.map(item=>{const a=item?.release||item||{};const ep=item?.published_release_episode||{};const p=a.poster||a.posters||{};const image=typeof p==='string'?p:(p.optimized?.original||p.optimized?.preview||p.original||p.preview||p.thumbnail||p.url||p.small?.url||p.small||p.medium?.url||p.medium||p.large?.url||p.large);let weekday=item?.publish_day?.value??item?.publish_day??a?.publish_day?.value??a?.publish_day;const n=Number(weekday);if(Number.isFinite(n)){if(n>=1&&n<=7)weekday=n-1;else if(n>=0&&n<=6)weekday=n}else{const s=String(weekday??'').toLowerCase();const m={mon:0,tue:1,wed:2,thu:3,fri:4,sat:5,sun:6,пн:0,вт:1,ср:2,чт:3,пт:4,сб:5,вс:6};const k=Object.keys(m).find(k=>s.startsWith(k));weekday=k==null?null:m[k]}const rr=Number(a.rating?.average??a.rating?.score??a.rating?.value??a.rating??a.average_score??a.averageScore??a.score);return{id:a.id,title:a.name?.main||a.name?.english||a.name?.alternative||'Без названия',image:image?.startsWith('http')?image:`https://anilibria.top/${String(image||'').replace(/^\//,'')}`,rating:Number.isFinite(rr)&&rr>0?(rr>10?rr/10:rr).toFixed(1):'—',episode:ep.ordinal??item?.next_release_episode_number??null,time:ep.updated_at||item?.time||a.time||null,weekday,status:a.is_ongoing?'Выходит':'Вышел'}).filter(x=>x.id&&x.title&&x.image&&x.weekday!=null);renderSchedule()}catch(e){console.error('AnimeSpace schedule:',e);document.getElementById('grid').innerHTML='<div class="empty">Не удалось загрузить расписание.</div>'}}renderSchedule();loadSchedule();</script></body></html>

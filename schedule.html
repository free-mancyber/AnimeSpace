<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeSpace — Расписание</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="logo-link" href="index.html"><img class="logo" src="image.png" alt="AnimeSpace"></a><nav class="nav"><a href="index.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8M5.5 9.5V21h13V9.5M9.5 21v-6h5v6"/></svg></span>Главное</a><a class="active" href="schedule.html"><span class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span>Расписание</a><a href="top100.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 17 9 12l4 3 7-8M17 7h3v3M4 20h16"/></svg></span>Топ 100</a><a href="search.html"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></span>Поиск</a><a class="profile-nav" id="profileNav" href="profile.html"><span class="icon" id="profileNavIcon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c.7-4 3.1-6 7-6s6.3 2 7 6"/></svg></span><span id="profileNavText" class="profile-nav-text">Профиль</span></a></nav></header><main class="page"><div class="page-inner"><h1 class="page-title">Расписание</h1><div class="schedule-search"><input id="q" class="input" placeholder="Найти аниме в расписании..."><button class="main-btn" onclick="renderSchedule()">Найти</button></div><div class="days" id="days"></div><div class="schedule-grid" id="grid"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=20260912-6"></script><script>const names=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];let activeDay=names[(new Date().getDay()+6)%7];names.forEach(d=>{const b=document.createElement('button');b.className='day-btn';b.textContent=d;b.onclick=()=>{activeDay=d;renderSchedule()};document.getElementById('days').appendChild(b)});window.animeSpaceRenderSchedule=renderSchedule;function dayKey(d){return ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].indexOf(d)}function renderSchedule(){const grid=document.getElementById('grid');document.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('active',b.textContent===activeDay));const q=document.getElementById('q').value.trim().toLowerCase();const list=(window.animeSpaceSchedule||[]).filter(x=>{const date=x.time?new Date(x.time):null;const weekday=date&&!isNaN(date)?(date.getDay()+6)%7:-1;return (weekday<0||weekday===dayKey(activeDay))&&(!q||x.title.toLowerCase().includes(q))});grid.innerHTML=list.length?list.map(a=>`<article class="schedule-card" data-anime='${packAnime(a)}'><img src="${esc(a.image)}" alt="${esc(a.title)}" loading="lazy"><div class="schedule-info"><div class="schedule-name">${esc(a.title)}</div><div class="schedule-meta">${a.episode?'Серия '+esc(a.episode):'Новая серия'}${a.time?' · '+new Date(a.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):''}</div><div class="schedule-status">${esc(a.status||'Выходит')}</div></div></article>`).join(''):'<div class="empty">Аниме по вашему запросу не найдено.</div>'}renderSchedule()</script></body></html>

<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeSpace — Расписание</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="header.css"></head><body><header class="topbar"><a class="logo-link" href="index.html"><img class="logo" src="image.png" alt="AnimeSpace"></a><nav class="nav"><a href="index.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8M5.5 9.5V21h13V9.5M9.5 21v-6h5v6"/></svg></span>Главное</a><a class="active" href="schedule.html"><span class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span>Расписание</a><a href="top100.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 17 9 12l4 3 7-8M17 7h3v3M4 20h16"/></svg></span>Топ 100</a><a href="search.html"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></span>Поиск</a><a class="profile-nav" id="profileNav" href="profile.html"><span class="icon" id="profileNavIcon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c.7-4 3.1-6 7 6"/></svg></span><span id="profileNavText" class="profile-nav-text">Профиль</span></a></nav></header><main class="page"><div class="page-inner"><h1 class="page-title">Расписание</h1><div class="schedule-search"><input id="q" class="input" placeholder="Найти аниме в расписании..."><button class="main-btn" onclick="renderSchedule()">Найти</button></div><div class="days" id="days"></div><div class="schedule-grid" id="grid"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=20260912-9"></script><script>const names=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];let activeDay=names[(new Date().getDay()+6)%7];names.forEach(d=>{const b=document.createElement('button');b.className='day-btn';b.textContent=d;b.onclick=()=>{activeDay=d;renderSchedule()};document.getElementById('days').appendChild(b)});window.animeSpaceRenderSchedule=renderSchedule;function dayKey(d){return ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].indexOf(d)}function getWeekday(value){if(typeof value==='number'){if(value>=1&&value<=7)return value-1;if(value>=0&&value<=6)return value}if(value&&typeof value==='object')return getWeekday(value.value??value.id??value.key??value.name);if(typeof value==='string'){const v=value.trim().toLowerCase();const map={'пн':0,'понедельник':0,'monday':0,'mon':0,'вт':1,'вторник':1,'tuesday':1,'tue':1,'ср':2,'среда':2,'wednesday':2,'wed':2,'чт':3,'четверг':3,'thursday':3,'thu':3,'пт':4,'пятница':4,'friday':4,'fri':4,'сб':5,'суббота':5,'saturday':5,'sat':5,'вс':6,'воскресенье':6,'sunday':6,'sun':6};if(v in map)return map[v];const n=Number(v);if(Number.isFinite(n))return getWeekday(n)}return -1}function renderSchedule(){const grid=document.getElementById('grid');document.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('active',b.textContent===activeDay));const q=document.getElementById('q').value.trim().toLowerCase();const list=(window.animeSpaceSchedule||[]).filter(x=>{let weekday=getWeekday(x.weekday??x.publish_day??x.day);if(weekday<0&&x.time){const date=new Date(x.time);if(!isNaN(date.getTime()))weekday=(date.getDay()+6)%7}return weekday===dayKey(activeDay)&&(!q||String(x.title||'').toLowerCase().includes(q))});grid.innerHTML=list.length?list.map(a=>`<article class="anime-card schedule-anime-card" data-anime='${packAnime(a)}'><div class="anime-card-poster"><img src="${esc(a.image||'image.png')}" alt="${esc(a.title)}" loading="lazy"><div class="anime-card-rating"><span class="anime-card-star">★</span><span class="anime-card-rating-value">${esc(a.rating||'—')}</span></div></div><div class="anime-card-title">${esc(a.title)}</div><div class="anime-card-meta">${a.episode?'Серия '+esc(a.episode):'Новая серия'}${a.time?' • '+new Date(a.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):''} • ${esc(a.status||'Выходит')}</div></article>`).join(''):'<div class="empty">Аниме по вашему запросу не найдено.</div>'}async function loadAniLibertySchedule(){try{const r=await fetch('https://anilibria.top/api/v1/anime/schedule/week',{cache:'no-store'});if(!r.ok)throw new Error('AniLiberty Schedule API: '+r.status);const json=await r.json();const rows=Array.isArray(json?.data)?json.data:(Array.isArray(json)?json:[]);window.animeSpaceSchedule=rows.map(item=>{const a=item?.release||{};const poster=a.poster?.optimized?.preview||a.poster?.preview||a.poster?.optimized?.thumbnail||a.poster?.thumbnail||'';const image=poster?(poster.startsWith('http')?poster:'https://anilibria.top'+poster):'';const weekday=getWeekday(a.publish_day??item?.publish_day??item?.day);const ep=item?.published_release_episode;return{id:a.id,title:a.name?.main||a.name?.english||a.name?.alternative||'Без названия',image,rating:a.rating?.average!=null?Number(a.rating.average).toFixed(1):'—',year:a.year||null,episodes:a.episodes_total||0,status:a.is_ongoing?'Выходит':'Вышел',duration:a.average_duration_of_episode||0,episode:ep?.ordinal??item?.next_release_episode_number??null,time:ep?.updated_at||null,weekday,source:'anilibria'} }).filter(x=>x.id&&x.title);renderSchedule()}catch(e){console.error('AnimeSpace AniLiberty schedule:',e);window.animeSpaceSchedule=[];renderSchedule()}}loadAniLibertySchedule()</script></body></html>

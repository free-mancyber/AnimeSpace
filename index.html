<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimeSpace</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#090b12;color:#f5f7fb;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(92%,430px);padding:32px;background:#121622;border:1px solid #252b3a;border-radius:20px;box-shadow:0 20px 60px #0008}.logo{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:#6d5dfc;font-size:25px;font-weight:800;margin-bottom:22px}.tag{color:#9aa4b8;font-size:14px;margin:0 0 8px}.title{font-size:32px;margin:0 0 8px}.sub{color:#9aa4b8;margin:0 0 28px}label{display:block;font-size:14px;margin:16px 0 7px}input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid #303749;background:#0d111b;color:#fff;outline:none}input:focus{border-color:#6d5dfc}.btn{width:100%;margin-top:24px;padding:14px;border:0;border-radius:11px;background:#6d5dfc;color:white;font-weight:700;font-size:15px;cursor:pointer}.login{text-align:center;color:#9aa4b8;margin:22px 0 0;font-size:14px}.login a{color:#9b91ff;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">A</div>
    <p class="tag">AnimeSpace</p>
    <h1 class="title">Создать аккаунт</h1>
    <p class="sub">Присоединяйся к AnimeSpace</p>
    <form onsubmit="event.preventDefault(); alert('Демо: регистрация будет подключена позже.');">
      <label for="name">Никнейм</label><input id="name" placeholder="Твой никнейм" required>
      <label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" required>
      <label for="password">Пароль</label><input id="password" type="password" placeholder="••••••••" required>
      <label for="password2">Повторите пароль</label><input id="password2" type="password" placeholder="••••••••" required>
      <button class="btn" type="submit">Создать аккаунт</button>
    </form>
    <p class="login">Уже есть аккаунт? <a href="#">Войти</a></p>
  </main>
</body>
</html>

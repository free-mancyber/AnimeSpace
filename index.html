<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080910">
<title>AnimeSpace</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:#fff}body{min-height:100vh;background:#080910}.topbar{position:relative;width:100%;height:92px;display:flex;align-items:center;padding:0 20px;background:linear-gradient(180deg,rgba(24,24,38,.58),rgba(10,10,17,.38));backdrop-filter:blur(42px) saturate(190%);-webkit-backdrop-filter:blur(42px) saturate(190%);border-bottom:1px solid rgba(255,255,255,.2);box-shadow:0 12px 45px rgba(0,0,0,.42),0 1px 28px rgba(139,92,246,.34),0 1px 22px rgba(255,55,95,.22);overflow:hidden}.topbar:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.045) 30%,transparent 65%),linear-gradient(90deg,rgba(255,55,95,.06),transparent 35%,rgba(139,92,246,.08));border-radius:0 0 22px 22px}.topbar:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,rgba(255,55,95,.95),rgba(255,255,255,.25),rgba(139,92,246,1),rgba(255,255,255,.25),rgba(255,55,95,.95));box-shadow:0 0 16px rgba(139,92,246,.75),0 0 12px rgba(255,55,95,.5)}.logo-link{width:440px;height:100%;display:flex;align-items:center;justify-content:flex-start;flex-shrink:0;padding-right:0;margin-left:-32px;position:relative;z-index:2}.logo{width:430px;height:92px;object-fit:contain;display:block}.nav{position:absolute;left:440px;right:0;top:0;height:100%;display:flex;align-items:center;z-index:1}.nav button{position:relative;flex:1;height:100%;padding:0 12px;border:0;border-radius:0;background:rgba(255,255,255,.015);color:#aeb2c1;font-size:16px;font-weight:600;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:10px}.nav button:hover{color:#fff;background:rgba(255,255,255,.07)}.nav button.active{color:#fff;background:rgba(255,255,255,.035);text-shadow:0 0 12px rgba(255,255,255,.18)}.nav button.active:after{content:"";position:absolute;left:16%;right:16%;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,#ff3b6b,#8b5cf6);box-shadow:0 0 12px rgba(139,92,246,.65)}.icon{width:21px;height:21px;display:inline-flex;align-items:center;justify-content:center;color:currentColor}.icon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.content{min-height:calc(100vh - 92px);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;margin:0;padding:0}.anime-card{position:relative;height:360px;overflow:hidden;background:#10111a;border-right:1px solid rgba(255,255,255,.04)}.anime-card img{width:100%;height:100%;object-fit:cover;display:block}.anime-card .info{position:absolute;left:0;right:0;bottom:0;padding:44px 14px 14px;background:linear-gradient(transparent,rgba(0,0,0,.92));text-align:left}.anime-card .title{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.anime-card .rating{margin-top:5px;font-size:13px;color:#d8dbe8}.anime-card:hover{filter:brightness(1.08)}@media(max-width:1100px){.content{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:700px){.topbar{height:76px;padding:0 6px}.logo-link{width:310px;padding-right:0;margin-left:-20px}.logo{width:300px;height:74px}.nav{left:310px;min-width:620px}.nav button{font-size:14px;gap:7px}.icon,.icon svg{width:19px;height:19px}.content{min-height:calc(100vh - 76px);grid-template-columns:repeat(3,minmax(0,1fr))}.anime-card{height:300px}.anime-card .info{padding:38px 8px 9px}.anime-card .title{font-size:14px}.anime-card .rating{font-size:11px}}
</style>
</head>
<body>
<header class="topbar">
<a class="logo-link" href="#" aria-label="AnimeSpace"><img class="logo" src="image.png" alt="AnimeSpace"></a>
<nav class="nav" aria-label="Основная навигация">
<button class="active" onclick="activate(this)"><span class="icon"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></svg></span><span>Главное</span></button>
<button onclick="activate(this)"><span class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span><span>Расписание</span></button>
<button onclick="activate(this)"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 17 9 12l4 3 7-8"/><path d="M17 7h3v3"/><path d="M4 20h16"/></svg></span><span>Топ 100</span></button>
<button onclick="activate(this)"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></span><span>Поиск</span></button>
<button onclick="activate(this)"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c.7-4 3.1-6 7-6s6.3 2 7 6"/></svg></span><span>Профиль</span></button>
</nav>
</header>
<main class="content">
<article class="anime-card"><img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=700&q=80" alt="Аниме"><div class="info"><div class="title">Рекомендуемое аниме</div><div class="rating">★ 8.7</div></div></article>
<article class="anime-card"><img src="https://images.unsplash.com/photo-1560972550-aba3456b5564?auto=format&fit=crop&w=700&q=80" alt="Аниме"><div class="info"><div class="title">Новая история</div><div class="rating">★ 8.5</div></div></article>
<article class="anime-card"><img src="https://images.unsplash.com/photo-1613376023733-0a73315d9b06?auto=format&fit=crop&w=700&q=80" alt="Аниме"><div class="info"><div class="title">Лучший выбор</div><div class="rating">★ 9.0</div></div></article>
<article class="anime-card"><img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=700&q=80" alt="Аниме"><div class="info"><div class="title">Тёмный мир</div><div class="rating">★ 8.3</div></div></article>
<article class="anime-card"><img src="https://images.unsplash.com/photo-1618336753974-aae8e04506aa?auto=format&fit=crop&w=700&q=80" alt="Аниме"><div class="info"><div class="title">Новая глава</div><div class="rating">★ 8.9</div></div></article>
<article class="anime-card"><img src="https://images.unsplash.com/photo-1635805737707-575885ab0820?auto=format&fit=crop&w=700&q=80" alt="Аниме"><div class="info"><div class="title">Герои</div><div class="rating">★ 8.6</div></div></article>
</main>
<script>
function activate(button){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));button.classList.add('active');}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080910">
<title>AnimeSpace</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:#fff}body{min-height:100vh;background:#080910}.topbar{width:100%;height:76px;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid rgba(255,255,255,.09);background:rgba(12,11,20,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.nav{margin-left:auto;height:100%;display:flex;align-items:center;gap:8px}.nav button{height:44px;padding:0 18px;border:0;border-radius:12px;background:transparent;color:#bfc2cf;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}.nav button:hover{background:rgba(255,255,255,.07);color:#fff}.nav button.active{background:rgba(139,92,246,.14);color:#fff}.content{min-height:calc(100vh - 76px)}@media(max-width:700px){.topbar{height:64px;padding:0 12px;overflow-x:auto}.nav{margin-left:0;min-width:max-content}.nav button{padding:0 13px;font-size:14px}.content{min-height:calc(100vh - 64px)}}
</style>
</head>
<body>
<header class="topbar">
<nav class="nav" aria-label="Основная навигация">
<button class="active">Главное</button>
<button>Расписание</button>
<button>Топ 100</button>
<button>Поиск</button>
<button>Профиль</button>
</nav>
</header>
<main class="content"></main>
</body>
</html>

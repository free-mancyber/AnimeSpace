<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#080910"><title>AnimeSpace — Регистрация</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:#fff}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,rgba(5,6,14,.82),rgba(18,8,31,.72)),radial-gradient(circle at 80% 20%,#6941c655,transparent 35%),#080910;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 0 45%,rgba(255,255,255,.025) 50%,transparent 55%)}.wrap{width:min(100%,460px);position:relative;z-index:1}.card{padding:34px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(14,15,25,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 30px 90px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.06)}.brand{display:flex;align-items:center;gap:13px;margin-bottom:30px}.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:24px;font-weight:900;background:linear-gradient(135deg,#8b5cf6,#5b5bf7);box-shadow:0 10px 30px rgba(108,82,246,.4)}.brand-name{font-size:19px;font-weight:800;letter-spacing:.2px}.brand-name span{color:#a78bfa}.tag{margin:0 0 8px;color:#a9afc1;font-size:13px;text-transform:uppercase;letter-spacing:1.5px}h1{margin:0;font-size:34px;line-height:1.1;letter-spacing:-1px}.sub{margin:10px 0 28px;color:#969caf;line-height:1.5}form{display:grid}label{display:block;margin:15px 0 8px;font-size:13px;color:#d9dce7;font-weight:600}input{width:100%;padding:14px 15px;border-radius:13px;border:1px solid rgba(255,255,255,.11);background:rgba(5,7,14,.65);color:#fff;outline:none;font-size:15px;transition:.2s}input::placeholder{color:#62697b}input:focus{border-color:#8b5cf6;box-shadow:0 0 0 4px rgba(139,92,246,.12)}.btn{width:100%;margin-top:25px;padding:15px;border:0;border-radius:13px;background:linear-gradient(135deg,#8b5cf6,#6657f5);color:#fff;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 12px 28px rgba(105,80,245,.28);transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.login{text-align:center;color:#858c9f;margin:22px 0 0;font-size:14px}.login a{color:#b39cff;text-decoration:none;font-weight:700}@media(max-width:520px){body{padding:14px}.card{padding:25px 20px;border-radius:22px}h1{font-size:29px}.brand{margin-bottom:24px}}
</style></head>
<body><main class="wrap"><section class="card"><div class="brand"><div class="logo">A</div><div class="brand-name">Anime<span>Space</span></div></div><p class="tag">Добро пожаловать</p><h1>Создать аккаунт</h1><p class="sub">Присоединяйся к AnimeSpace и собирай свою коллекцию аниме.</p><form onsubmit="event.preventDefault();alert('Демо: регистрация будет подключена позже.');"><label for="name">Никнейм</label><input id="name" placeholder="Твой никнейм" autocomplete="username" required><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email" required><label for="password">Пароль</label><input id="password" type="password" placeholder="Введите пароль" autocomplete="new-password" required><label for="password2">Повторите пароль</label><input id="password2" type="password" placeholder="Повторите пароль" autocomplete="new-password" required><button class="btn" type="submit">Создать аккаунт</button></form><p class="login">Уже есть аккаунт? <a href="#">Войти</a></p></section></main></body></html>

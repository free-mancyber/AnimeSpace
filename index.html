<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080910">
<title>AnimeSpace</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:#fff}body{min-height:100vh;background:#080910}.topbar{position:relative;width:100%;height:82px;display:flex;align-items:center;padding:0 20px;background:rgba(10,10,17,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.10);box-shadow:0 1px 18px rgba(139,92,246,.22),0 1px 12px rgba(255,55,95,.16)}.topbar:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,rgba(255,55,95,.8),rgba(139,92,246,.85),rgba(255,55,95,.8));opacity:.65}.nav{width:100%;height:100%;display:flex;align-items:center}.nav button{position:relative;flex:1;height:100%;padding:0 12px;border:0;border-radius:0;background:transparent;color:#aeb2c1;font-size:16px;font-weight:600;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:10px}.nav button:hover{color:#fff;background:rgba(255,255,255,.035)}.nav button.active{color:#fff}.nav button.active:after{content:"";position:absolute;left:16%;right:16%;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,#ff3b6b,#8b5cf6);box-shadow:0 0 12px rgba(139,92,246,.65)}.icon{width:21px;height:21px;display:inline-flex;align-items:center;justify-content:center;color:currentColor}.icon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.content{min-height:calc(100vh - 82px)}@media(max-width:700px){.topbar{height:68px;padding:0 6px;overflow-x:auto}.nav{min-width:620px}.nav button{font-size:14px;gap:7px}.icon,.icon svg{width:19px;height:19px}.content{min-height:calc(100vh - 68px)}}
</style>
</head>
<body>
<header class="topbar">
<nav class="nav" aria-label="Основная навигация">
<button class="active"><span class="icon"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></svg></span><span>Главное</span></button>
<button><span class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span><span>Расписание</span></button>
<button><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 17 9 12l4 3 7-8"/><path d="M17 7h3v3"/><path d="M4 20h16"/></svg></span><span>Топ 100</span></button>
<button><span class="icon"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></span><span>Поиск</span></button>
<button><span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c.7-4 3.1-6 7-6s6.3 2 7 6"/></svg></span><span>Профиль</span></button>
</nav>
</header>
<main class="content"></main>
</body>
</html>

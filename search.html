<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeSpace — Поиск</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="logo-link" href="index.html"><img class="logo" src="image.png" alt="AnimeSpace"></a><nav class="nav"><a href="index.html"><span class="icon">⌂</span>Главное</a><a href="schedule.html"><span class="icon">▣</span>Расписание</a><a href="top100.html"><span class="icon">↗</span>Топ 100</a><a class="active" href="search.html"><span class="icon">⌕</span>Поиск</a><a href="profile.html"><span class="icon">♙</span>Профиль</a></nav></header><main class="page"><div class="page-inner"><h1 class="page-title">Поиск аниме</h1><div class="search-line"><input id="q" class="input" placeholder="Название аниме..."><button class="main-btn" onclick="searchAnime()">Найти</button></div><div class="filter-card"><span class="filter-label">Жанры</span><div class="genres" id="genres"></div><div class="filters"><select class="filter-select" id="type"><option>Тип: любой</option><option>Сериал</option><option>Фильм</option><option>OVA</option><option>ONA</option></select><select class="filter-select" id="year"><option>Год: любой</option></select><select class="filter-select" id="rating"><option>Рейтинг: любой</option></select></div></div><section id="results" class="result-grid" style="margin-top:28px"></section></div></main><script src="app.js"></script><script>const genres=['Экшен','Приключения','Комедия','Драма','Фэнтези','Романтика','Фантастика','Ужасы','Детектив','Триллер','Спорт','Музыка','Школа','Мистика','Меха','Самураи','Демоны','Магия','Повседневность','Сёнэн','Исекай'];genres.forEach(g=>{const b=document.createElement('button');b.className='genre';b.textContent=g;b.onclick=()=>b.classList.toggle('active');document.getElementById('genres').appendChild(b)});for(let y=new Date().getFullYear();y>=1990;y--){const o=document.createElement('option');o.textContent='Год: '+y;document.getElementById('year').appendChild(o)}for(let r=10;r>=1;r-=.1){const o=document.createElement('option');o.textContent='Рейтинг: от '+r.toFixed(1);document.getElementById('rating').appendChild(o)}function searchAnime(){const q=document.getElementById('q').value.trim()||'Любое аниме';const selected=[...document.querySelectorAll('.genre.active')].map(x=>x.textContent).join(', ')||'Любые';const type=document.getElementById('type').value;const year=document.getElementById('year').value;const rating=document.getElementById('rating').value;const result=document.getElementById('results');result.innerHTML=`<div class="no-results"><strong>Результаты поиска</strong><br><br>Запрос: ${esc(q)}<br>Жанры: ${esc(selected)}<br>${esc(type)} · ${esc(year)} · ${esc(rating)}<br><br>Интерфейс поиска готов. Данные подключим позже.</div>`}</script></body></html>

<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeSpace — Поиск</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="logo-link" href="index.html"><img class="logo" src="image.png" alt="AnimeSpace"></a><nav class="nav"><a href="index.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8M5.5 9.5V21h13V9.5M9.5 21v-6h5v6"/></svg></span>Главное</a><a href="schedule.html"><span class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span>Расписание</a><a href="top100.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 17 9 12l4 3 7-8M17 7h3v3M4 20h16"/></svg></span>Топ 100</a><a class="active" href="search.html"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></span>Поиск</a><a class="profile-nav" id="profileNav" href="profile.html"><span class="icon" id="profileNavIcon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c.7-4 3.1-6 7-6s6.3 2 7 6"/></svg></span><span id="profileNavText" class="profile-nav-text">Профиль</span></a></nav></header><main class="page"><div class="page-inner"><h1 class="page-title">Поиск аниме</h1><div class="search-line"><input id="q" class="input" placeholder="Название аниме..."><button class="main-btn" onclick="searchAnime()">Найти</button></div><section class="popular-search"><h2>Популярные аниме</h2><div class="popular-search-row" id="popularSearch"></div></section><div class="filter-card"><span class="filter-label">Жанры</span><div class="genres" id="genres"></div><div class="filters"><select class="filter-select" id="type"><option>Тип: любой</option><option>Сериал</option><option>Фильм</option><option>OVA</option><option>ONA</option></select><select class="filter-select" id="year"><option>Год: любой</option></select><select class="filter-select" id="rating"><option>Рейтинг: любой</option></select></div></div><section id="results" class="result-grid" style="margin-top:28px"></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=20260912-4"></script><script>const popularSearch=document.getElementById('popularSearch');async function loadPopular(){try{const list=await getAnimes({limit:12,order:'popularity'});popularSearch.innerHTML=list.map(a=>`<article class="popular-search-card" data-anime='${encodeURIComponent(JSON.stringify(a))}'><img src="${esc(a.image)}" alt="${esc(a.title)}" loading="lazy"><div>${esc(a.title)}</div></article>`).join('')}catch(e){console.warn(e)}}const genres=['Экшен','Приключения','Комедия','Драма','Фэнтези','Романтика','Фантастика','Ужасы','Детектив','Триллер','Спорт','Музыка','Школа','Мистика','Меха','Самураи','Демоны','Магия','Повседневность','Сёнэн','Исекай'];genres.forEach(g=>{const b=document.createElement('button');b.className='genre';b.textContent=g;b.onclick=()=>b.classList.toggle('active');document.getElementById('genres').appendChild(b)});for(let y=new Date().getFullYear();y>=1990;y--){const o=document.createElement('option');o.textContent='Год: '+y;document.getElementById('year').appendChild(o)}for(let r=10;r>=1;r-=.1){const o=document.createElement('option');o.textContent='Рейтинг: от '+r.toFixed(1);document.getElementById('rating').appendChild(o)}async function searchAnime(){const q=document.getElementById('q').value.trim();const result=document.getElementById('results');if(!q){result.innerHTML='<div class="no-results">Введите название аниме.</div>';return}result.innerHTML='<div class="no-results">Загрузка...</div>';try{let list=await searchShikimori(q);const activeGenres=[...document.querySelectorAll('.genre.active')].map(x=>x.textContent);const year=document.getElementById('year').value;const rating=document.getElementById('rating').value;list=list.filter(a=>(!activeGenres.length||activeGenres.every(g=>a.genres.includes(g)))&&(!year||year==='Год: любой'||String(a.year)===year.replace('Год: ',''))&&(!rating||rating==='Рейтинг: любой'||Number(a.rating)>=Number(rating.replace('Рейтинг: от ',''))));result.innerHTML=list.length?list.map(a=>`<article class="anime-card" data-anime='${encodeURIComponent(JSON.stringify(a))}'><img src="${esc(a.image)}" alt="${esc(a.title)}" loading="lazy"><div class="info"><div class="title">${esc(a.title)}</div><div class="rating">${esc(a.rating)}</div></div></article>`).join(''):'<div class="no-results">Ничего не найдено.</div>'}catch(e){console.error(e);result.innerHTML='<div class="no-results">Не удалось загрузить данные AniList.</div>'}}loadPopular();</script></body></html>

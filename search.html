<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeSpace — Поиск</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="header.css"><link rel="stylesheet" href="card-style.css?v=20260917-1"><link rel="stylesheet" href="search-fix.css?v=20260913-1"><link rel="stylesheet" href="ui-frame.css?v=20260917-1"></head><body><header class="topbar"><a class="logo-link" href="index.html"><img class="logo" src="image.png" alt="AnimeSpace"></a><nav class="nav"><a href="index.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8M5.5 9.5V21h13V9.5"/></svg></span>Главное</a><a href="schedule.html"><span class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span>Расписание</a><a href="top100.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M8 4h8v4c0 3.2-1.8 5.4-4 6-2.2-.6-4-2.8-4-6V4Z"/><path d="M8 6H5v2c0 2.8 1.8 4.5 4 5M16 6h3v2c0 2.8-1.8 4.5-4 5M12 14v5M8 21h8"/></svg></span>Топ 100</a><a class="active" href="search.html"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></span>Поиск</a><a class="profile-nav" id="profileNav" href="profile.html"><span class="icon" id="profileNavIcon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c.7-4 3.1-6 7-6s6.3 2 7 6"/></svg></span><span id="profileNavText" class="profile-nav-text">Профиль</span></a></nav></header><main class="page"><div class="page-inner"><h1 class="page-title">Поиск аниме</h1><section id="results" class="result-grid" style="display:none;margin-top:28px"></section><div class="search-line"><input id="q" class="input" placeholder="Название аниме..."><button class="main-btn" id="searchBtn" aria-label="Поиск"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button></div><div class="filter-card"><span class="filter-label">Жанры</span><div class="genres" id="genres"></div><div class="filters"><select class="filter-select" id="type"><option value="">Тип: любой</option><option value="Сериал">Сериал</option><option value="Фильм">Фильм</option><option value="OVA">OVA</option><option value="ONA">ONA</option></select><select class="filter-select" id="year"><option value="">Год: любой</option></select><select class="filter-select" id="rating"><option value="">Рейтинг: любой</option></select></div></div><section class="popular-search"><div class="popular-search-row" id="popularSearch"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=20260915-2"></script><script src="anilibria-search-fallback.js?v=20260916-1"></script><script>const popularSearch=document.getElementById('popularSearch');const genres=['Экшен','Приключения','Комедия','Драма','Фэнтези','Романтика','Фантастика','Ужасы','Детектив','Триллер','Спорт','Музыка','Школа','Мистика','Меха','Самураи','Демоны','Магия','Повседневность','Сёнэн','Исекай'];genres.forEach(g=>{const b=document.createElement('button');b.className='genre';b.textContent=g;b.onclick=()=>b.classList.toggle('active');document.getElementById('genres').appendChild(b)});for(let y=new Date().getFullYear();y>=1990;y--){const o=document.createElement('option');o.value=y;o.textContent='Год: '+y;document.getElementById('year').appendChild(o)}for(let r=10;r>=1;r-=.1){const value=r.toFixed(1);const o=document.createElement('option');o.value=value;o.textContent='Рейтинг: от '+value;document.getElementById('rating').appendChild(o)}async function loadPopular(){try{const list=await getAnimes({limit:12,order:'popularity'});popularSearch.innerHTML=list.map(a=>`<article class="popular-search-card anime-card" data-anime='${packAnime(a)}'><div class="anime-card-poster"><img src="${esc(a.image)}" alt="${esc(a.title)}" loading="lazy"><div class="anime-card-rating"><span class="anime-card-star">★</span><span class="anime-card-rating-value">${esc(a.rating||'—')}</span></div></div><div class="anime-card-title">${esc(a.title)}</div><div class="anime-card-meta">${a.year||'—'} • ${esc(a.type||'—')}</div></article>`).join('')}catch(e){console.warn(e)}}const qInput=document.getElementById('q');async function searchAnime(){const q=qInput.value.trim();const result=document.getElementById('results');const activeGenres=[...document.querySelectorAll('.genre.active')].map(x=>x.textContent);const year=document.getElementById('year').value;const rating=document.getElementById('rating').value;const format=document.getElementById('type').value;result.style.display='grid';if(!q&&!activeGenres.length&&!year&&!rating&&!format){result.innerHTML='<div class="no-results">Выберите жанр, год, рейтинг или введите название.</div>';return}result.innerHTML='<div class="no-results">Загрузка...</div>';try{const list=await searchAnimeApi(q,{genres:activeGenres,year,rating,format});result.innerHTML=list.length?list.map(a=>`<article class="anime-card" data-anime='${packAnime(a)}'><div class="anime-card-poster"><img src="${esc(a.image)}" alt="${esc(a.title)}" loading="lazy"><div class="anime-card-rating"><span class="anime-card-star">★</span><span class="anime-card-rating-value">${esc(a.rating||'—')}</span></div></div><div class="anime-card-title">${esc(a.title)}</div><div class="anime-card-meta">${a.year||'—'} • ${esc(a.type||'—')}</div></article>`).join(''):'<div class="no-results">Ничего не найдено.</div>'}catch(e){console.error(e);result.innerHTML='<div class="no-results">Не удалось загрузить результаты поиска.</div>'}}document.getElementById('searchBtn').addEventListener('click',searchAnime);qInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchAnime()}});loadPopular();</script></body></html>

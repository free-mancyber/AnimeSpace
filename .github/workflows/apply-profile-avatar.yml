name: Apply profile avatar changes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</body></html>'
          if 'AnimeSpaceProfileEditor' in s:
              print('Already patched')
          else:
              extra = r'''<script id="AnimeSpaceProfileEditor">
          (function(){
            const profileAvatar=()=>document.querySelector('.profile-panel .avatar');
            const navAvatar=()=>document.querySelector('.nav button:nth-child(5) .icon');
            function paintAvatar(url){
              [profileAvatar(),navAvatar()].forEach((el,i)=>{
                if(!el)return;
                if(url){
                  el.innerHTML='<img src="'+url+'" alt="Аватар" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block">';
                  if(i===0){el.style.overflow='hidden';el.style.padding='0'}
                  if(i===1){el.style.overflow='hidden';el.style.borderRadius='50%'}
                }else{
                  el.innerHTML=i===0?'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c.7-4 3.1-6 7-6s6.3 2 7 6"/></svg>':'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c.7-4 3.1-6 7-6s6.3 2 7 6"/></svg>';
                  el.style.overflow='';el.style.padding='';el.style.borderRadius='';
                }
              });
            }
            async function loadProfileWithAvatar(){
              const nameEl=document.querySelector('.profile-name'),emailEl=document.querySelector('.profile-email');
              const {data:{user},error}=await supabaseClient.auth.getUser();
              if(error||!user){
                nameEl.textContent='Профиль';
                emailEl.innerHTML='<a href="login.html">Войти в аккаунт</a>';
                paintAvatar(null);
                return;
              }
              const meta=user.user_metadata||{};
              const nickname=meta.nickname||meta.name||user.email?.split('@')[0]||'Пользователь';
              nameEl.textContent=nickname;
              emailEl.textContent=user.email||'';
              paintAvatar(meta.avatar_url||null);
            }
            window.loadProfile=loadProfileWithAvatar;
            function openEditor(){
              if(document.getElementById('profileEditor'))return;
              const modal=document.createElement('div');
              modal.id='profileEditor';
              modal.innerHTML='<div style="position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px"><div style="width:min(420px,100%);padding:24px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:#11121b;box-shadow:0 20px 70px rgba(0,0,0,.55)"><h2 style="margin:0 0 18px">Настройки профиля</h2><label style="display:block;color:#aeb2c1;font-size:13px;margin-bottom:8px">Ник</label><input id="profileNickname" style="width:100%;padding:13px 14px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:#080910;color:#fff;outline:none" maxlength="30"><button id="avatarPick" style="width:100%;margin-top:12px;padding:13px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.06);color:#fff;cursor:pointer">Выбрать аватар</button><input id="avatarFile" type="file" accept="image/*" hidden><div id="avatarStatus" style="margin-top:10px;color:#9fa3b5;font-size:12px"></div><div style="display:flex;gap:10px;margin-top:18px"><button id="profileCancel" style="flex:1;padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.05);color:#fff;cursor:pointer">Отмена</button><button id="profileSave" style="flex:1;padding:12px;border:0;border-radius:12px;background:linear-gradient(135deg,#ff3b6b,#8b5cf6);color:#fff;font-weight:700;cursor:pointer">Сохранить</button></div></div></div>';
              document.body.appendChild(modal);
              const input=modal.querySelector('#profileNickname'),file=modal.querySelector('#avatarFile'),status=modal.querySelector('#avatarStatus');
              supabaseClient.auth.getUser().then(({data:{user}})=>{if(user)input.value=user.user_metadata?.nickname||user.user_metadata?.name||user.email?.split('@')[0]||''});
              modal.querySelector('#avatarPick').onclick=()=>file.click();
              file.onchange=()=>{if(file.files[0])status.textContent='Выбрано: '+file.files[0].name};
              modal.querySelector('#profileCancel').onclick=()=>modal.remove();
              modal.querySelector('#profileSave').onclick=async()=>{
                const {data:{user}}=await supabaseClient.auth.getUser();
                if(!user)return;
                const nickname=input.value.trim();
                if(!nickname){status.textContent='Введите ник.';return}
                const save=modal.querySelector('#profileSave');save.disabled=true;status.textContent='Сохранение...';
                try{
                  const {error:nickError}=await supabaseClient.auth.updateUser({data:{nickname}});
                  if(nickError)throw nickError;
                  if(file.files[0]){
                    const f=file.files[0];
                    if(!f.type.startsWith('image/'))throw new Error('Можно выбрать только изображение.');
                    if(f.size>5*1024*1024)throw new Error('Максимальный размер аватара — 5 МБ.');
                    const ext=(f.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase()||'jpg';
                    const path=user.id+'/'+Date.now()+'.'+ext;
                    const {error:upError}=await supabaseClient.storage.from('avatars').upload(path,f,{upsert:true,contentType:f.type});
                    if(upError)throw upError;
                    const {data:urlData}=supabaseClient.storage.from('avatars').getPublicUrl(path);
                    const avatarUrl=urlData.publicUrl+'?t='+Date.now();
                    const {error:avatarError}=await supabaseClient.auth.updateUser({data:{nickname,avatar_url:avatarUrl}});
                    if(avatarError)throw avatarError;
                  }
                  await loadProfileWithAvatar();modal.remove();
                }catch(e){status.textContent='Ошибка: '+(e.message||'не удалось сохранить');save.disabled=false}
              };
            }
            document.querySelector('.settings-btn')?.addEventListener('click',openEditor);
            supabaseClient.auth.onAuthStateChange(()=>setTimeout(loadProfileWithAvatar,0));
            loadProfileWithAvatar();
          })();
          </script>'''
              s=s.replace(marker,extra+marker)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit patched index.html and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-profile-avatar.yml
          git add index.html
          git commit -m "Enable profile avatar and nickname editing"
          git push

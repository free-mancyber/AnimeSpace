<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeSpace — Профиль</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="logo-link" href="index.html"><img class="logo" src="image.png" alt="AnimeSpace"></a><nav class="nav"><a href="index.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8M5.5 9.5V21h13V9.5M9.5 21v-6h5v6"/></svg></span>Главное</a><a href="schedule.html"><span class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span>Расписание</a><a href="top100.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 17 9 12l4 3 7-8M17 7h3v3M4 20h16"/></svg></span>Топ 100</a><a href="search.html"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></span>Поиск</a><a class="active" href="profile.html"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c.7-4 3.1-6 7-6s6.3 2 7 6"/></svg></span>Профиль</a></nav></header><main class="page"><div class="page-inner"><div class="profile-head"><div class="avatar" id="avatar" title="Изменить аватар">♙</div><div><div class="profile-name" id="name">Профиль</div><div class="profile-email" id="email"><a href="login.html">Войти в аккаунт</a></div></div><button class="settings-btn" id="logout" aria-label="Выйти"><span class="logout-dot"></span>Выйти</button></div><div class="stats"><div class="stat"><strong>0</strong><span>Просмотрено</span></div><div class="stat"><strong>0</strong><span>В процессе</span></div><div class="stat"><strong>0</strong><span>В планах</span></div><div class="stat"><strong>0</strong><span>Брошено</span></div></div><div class="status-tabs"><button class="status-tab active" onclick="status(this,'Смотрю')">Смотрю</button><button class="status-tab" onclick="status(this,'В планах')">В планах</button><button class="status-tab" onclick="status(this,'Просмотрено')">Просмотрено</button><button class="status-tab" onclick="status(this,'Брошено')">Брошено</button></div><div class="status-content" id="status"><strong>Смотрю</strong><br>Здесь появятся аниме, которые вы сейчас смотрите.</div></div></main><div class="avatar-modal" id="avatarModal"><div class="avatar-modal-box"><h3>Аватар</h3><div class="avatar-modal-actions"><button class="choose-avatar" id="chooseAvatar">Выбрать</button><button id="closeAvatar">Отмена</button></div><input id="avatarInput" type="file" accept="image/*" hidden></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://vbxjvwssjafcfbmqrqow.supabase.co';const SUPABASE_KEY='sb_publishable__5mPBElGBo1GFn7Yd0n4Ng_1i28p6aE';const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const avatar=document.getElementById('avatar'),avatarModal=document.getElementById('avatarModal'),avatarInput=document.getElementById('avatarInput');let currentUser=null;function avatarKey(){return currentUser?'animeSpaceAvatar:'+currentUser.id:''}function paintAvatar(data){avatar.innerHTML=data?'<img src="'+data+'" alt="Аватар">':'♙'}function openAvatar(){if(currentUser)avatarModal.classList.add('open')}async function load(){const{data:{user}}=await client.auth.getUser();currentUser=user;if(!user){document.getElementById('name').textContent='Профиль';document.getElementById('email').innerHTML='<a href="login.html">Войти в аккаунт</a>';paintAvatar(null);return}const meta=user.user_metadata||{};document.getElementById('name').textContent=meta.nickname||meta.name||user.email?.split('@')[0]||'Пользователь';document.getElementById('email').textContent=user.email||'';paintAvatar(localStorage.getItem(avatarKey()))}avatar.onclick=openAvatar;document.getElementById('chooseAvatar').onclick=()=>avatarInput.click();document.getElementById('closeAvatar').onclick=()=>avatarModal.classList.remove('open');avatarModal.addEventListener('click',e=>{if(e.target===avatarModal)avatarModal.classList.remove('open')});avatarInput.addEventListener('change',e=>{const file=e.target.files?.[0];if(!file||!currentUser||!file.type.startsWith('image/'))return;if(file.size>5*1024*1024){alert('Максимальный размер изображения — 5 МБ');avatarInput.value='';return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=512,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',.8);try{localStorage.setItem(avatarKey(),data);paintAvatar(data);avatarModal.classList.remove('open')}catch{alert('Не удалось сохранить аватар')}};img.src=reader.result};reader.readAsDataURL(file);avatarInput.value='' });document.getElementById('logout').onclick=async()=>{const{error}=await client.auth.signOut();if(error){alert('Не удалось выйти из аккаунта');return}location.href='index.html'};load();function status(btn,name){document.querySelectorAll('.status-tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById('status').innerHTML='<strong>'+name+'</strong><br>Здесь появятся аниме из раздела «'+name+'».'}</script></body></html>

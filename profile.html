class="status-tabs"><button class="status-tab active" data-status="watching">Смотрю</button><button class="status-tab" data-status="plan">В планах</button><button class="status-tab" data-status="done">Просмотрено</button><button class="status-tab" data-status="dropped">Брошено</button></div><div class="status-content" id="statusContent"></div></div></main><div class="avatar-modal" id="avatarModal"><div class="avatar-modal-box"><h3>Аватар</h3><div class="avatar-modal-actions"><button class="choose-avatar" id="chooseAvatar">Выбрать</button><button id="closeAvatar">Отмена</button></div><input id="avatarInput" type="file" accept="image/*" hidden></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://vbxjvwssjafcfbmqrqow.supabase.co';const SUPABASE_KEY='sb_publishable__5mPBElGBo1GFn7Yd0n4Ng_1i28p6aE';const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}});const avatar=document.getElementById('avatar'),avatarModal=document.getElementById('avatarModal'),avatarInput=document.getElementById('avatarInput');let currentUser=null;const statusNames={watching:'Смотрю',plan:'В планах',done:'Просмотрено',dropped:'Брошено'};function avatarKey(){return currentUser?'animeSpaceAvatar:'+currentUser.id:''}function statusKey(){return 'animeSpaceStatuses:'+currentUser.id}function getStatuses(){try{return JSON.parse(localStorage.getItem(statusKey())||'{}')}catch{return {}}}function paintAvatar(data){avatar.innerHTML=data?'<img src="'+data+'" alt="Аватар">':'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c.7-4 3.1-6 7-6s6.3 2 7 6"/></svg>'}function openAvatar(){if(currentUser)avatarModal.classList.add('open')}function renderStatus(selected){const statuses=getStatuses(),list=Object.values(statuses).filter(a=>a.status===selected),content=document.getElementById('statusContent');content.innerHTML='<strong>'+statusNames[selected]+'</strong>';if(!list.length){content.innerHTML+='<div class="status-empty">Здесь пока нет аниме.</div>';return}const grid=document.createElement('div');grid.className='status-list';list.forEach(a=>{const item=document.createElement('article');item.className='status-item status-'+selected;const colors={plan:'#3b82f6',watching:'#ffffff',done:'#22c55e',dropped:'#ef4444'};item.style.borderColor=colors[selected]||'transparent';item.style.boxShadow=selected==='none'?'none':'inset 0 0 0 1px '+(colors[selected]||'transparent'),img=document.createElement('img');img.src=a.image||'';img.alt=a.title||'Аниме';const name=document.createElement('div');name.textContent=a.title||'Аниме';item.append(img,name);item.onclick=()=>{localStorage.setItem('selectedAnime',JSON.stringify(a));location.href='anime-details.html'};grid.appendChild(item)});content.appendChild(grid)}function refreshStatuses(){if(!currentUser)return;const statuses=getStatuses(),counts={watching:0,plan:0,done:0,dropped:0};Object.values(statuses).forEach(a=>{if(counts[a.status]!==undefined)counts[a.status]++});document.getElementById('countDone').textContent=counts.done;document.getElementById('countWatching').textContent=counts.watching;document.getElementById('countPlan').textContent=counts.plan;document.getElementById('countDropped').textContent=counts.dropped;renderStatus(document.querySelector('.status-tab.active')?.dataset.status||'watching')}avatar.onclick=openAvatar;document.getElementById('chooseAvatar').onclick=()=>avatarInput.click();document.getElementById('closeAvatar').onclick=()=>avatarModal.classList.remove('open');avatarModal.addEventListener('click',e=>{if(e.target===avatarModal)avatarModal.classList.remove('open')});avatarInput.addEventListener('change',e=>{const file=e.target.files?.[0];if(!file||!currentUser||!file.type.startsWith('image/'))return;if(file.size>5*1024*1024){alert('Максимальный размер изображения — 5 МБ');avatarInput.value='';return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=512,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',.8);try{localStorage.setItem(avatarKey(),data);paintAvatar(data);avatarModal.classList.remove('open')}catch{alert('Не удалось сохранить аватар')}};img.src=reader.result};reader.readAsDataURL(file);avatarInput.value=''});document.querySelectorAll('.status-tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.status-tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderStatus(btn.dataset.status)}));document.getElementById('logout').onclick=async()=>{const{error}=await client.auth.signOut();if(error){alert('Не удалось выйти из аккаунта');return}location.href='index.html'};async function load(){const{data:{user}}=await client.auth.getUser();currentUser=user;if(!user){document.getElementById('name').textContent='Профиль';document.getElementById('email').innerHTML='<a href="login.html">Войти в аккаунт</a>';paintAvatar(null);document.getElementById('statusContent').innerHTML='<strong>Смотрю</strong><div class="status-empty">Войдите в аккаунт, чтобы видеть свои списки.</div>';return}const meta=user.user_metadata||{};document.getElementById('name').textContent=meta.nickname||meta.name||user.email?.split('@')[0]||'Пользователь';document.getElementById('email').textContent=user.email||'';paintAvatar(localStorage.getItem(avatarKey()));refreshStatuses()}load();</script></body></html>

function animeKey(a){return String(a?.title||'').trim().toLowerCase()+'|'+String(a?.image||'').trim()}
function escapeHtml(value){return String(value??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function safeFrameUrl(url){

/* ---------- AniLibria (HLS) ---------- */
function attachStream(video,url,startTime,autoplay,onFatal){
  destroyHls();
  const begin=()=>{
    if(startTime>1){try{video.currentTime=startTime}catch{}}
    if(autoplay)video.play().catch(()=>{});
  };
  if(window.Hls&&window.Hls.isSupported()){
    let retries=0;
    hlsInstance=new Hls({maxBufferLength:40,enableWorker:true});
    hlsInstance.loadSource(url);
    hlsInstance.attachMedia(video);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED,begin);
    hlsInstance.on(Hls.Events.ERROR,(event,info)=>{
      if(!info||!info.fatal)return;
      if(info.type===Hls.ErrorTypes.NETWORK_ERROR&&retries<2){retries++;hlsInstance.startLoad();return}
      if(info.type===Hls.ErrorTypes.MEDIA_ERROR&&retries<2){retries++;hlsInstance.recoverMediaError();return}
      onFatal(info);
    });
  }else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=url;
    video.addEventListener('loadedmetadata',begin,{once:true});
    video.onerror=()=>onFatal({type:'native'});
  }else{
    onFatal({type:'unsupported'});
  }
}

function progressKey(){return 'animeSpaceProgress:'+animeKey(data)}
function loadProgress(){try{return JSON.parse(localStorage.getItem(progressKey())||'null')}catch{return null}}
function saveProgress(episode,time){try{localStorage.setItem(progressKey(),JSON.stringify({episode,time:Math.floor(time)}))}catch{}}

function pickQuality(ep,preferred){
  const available=[1080,720,480].filter(q=>ep.hls[q]);
  if(!available.length)return null;
  return available.find(q=>q<=preferred)||available[available.length-1];
}

function renderAniLibria(opts={}){
  const state=watchState;
  const player=document.getElementById('player');
  const panel=document.querySelector('.episode-panel');
  const ep=state.episodes.find(e=>e.number===state.episode)||state.episodes[0];
  state.episode=ep.number;
  const quality=pickQuality(ep,state.quality);
  if(!quality){setPlayerMessage('Для этой серии нет доступных потоков',state.release.url,'Открыть на AniLibria');return}
  state.quality=quality;

  let video=document.getElementById('video');
  if(!video){
    player.style.position='relative';
    player.innerHTML='<video id="video" controls playsinline preload="metadata" style="width:100%;height:100%;display:block;background:#000"></video><button id="skipBtn" class="skip-btn" type="button" hidden></button>';
    video=document.getElementById('video');
    const skipBtn=document.getElementById('skipBtn');
    let lastSave=0;
    video.addEventListener('timeupdate',()=>{
      const cur=state.episodes.find(e=>e.number===state.episode);
      const t=video.currentTime;
      let target=null,label='';
      if(cur?.opening&&t>=cur.opening.start&&t<cur.opening.stop-1){target=cur.opening.stop;label='Пропустить опенинг'}
      else if(cur?.ending&&t>=cur.ending.start&&t<cur.ending.stop-1){target=cur.ending.stop;label='Пропустить эндинг'}
      if(target!==null){skipBtn.hidden=false;skipBtn.textContent=label;skipBtn.dataset.target=target}else skipBtn.hidden=true;
      if(Date.now()-lastSave>5000&&t>5){lastSave=Date.now();saveProgress(state.episode,t)}
    });
    skipBtn.addEventListener('click',()=>{video.currentTime=Number(skipBtn.dataset.target)||video.currentTime;skipBtn.hidden=true});
    video.addEventListener('ended',()=>{
      const idx=state.episodes.findIndex(e=>e.number===state.episode);
      if(idx>=0&&idx<state.episodes.length-1){state.episode=state.episodes[idx+1].number;saveProgress(state.episode,0);renderAniLibria({autoplay:true})}
    });
  }
  video.poster=ep.preview||'';
  document.getElementById('skipBtn').hidden=true;
  attachStream(video,ep.hls[quality],opts.startTime||0,!!opts.autoplay,()=>{
    setPlayerMessage('Не удалось воспроизвести видео. Возможно, источник недоступен в вашем регионе.',state.release.url,'Смотреть на AniLibria');
  });

  if(!panel)return;
  const qualities=[1080,720,480].filter(q=>ep.hls[q]);
  let html='<div class="episode-title">Источник</div><div style="color:#9aa0b5;font-size:13px;line-height:1.5">AniLibria · <a href="'+escapeHtml(state.release.url)+'" target="_blank" rel="noopener" style="color:#a78bfa">на сайте</a></div>';
  html+='<div class="episode-title" style="margin-top:18px">Качество</div>';
  html+=qualities.map(q=>'<button class="voice'+(q===quality?' active':'')+'" data-quality="'+q+'">'+q+'p</button>').join('');
  html+='<div class="episode-title" style="margin-top:18px">Серии</div>';
  html+=state.episodes.map(e=>'<button class="episode'+(e.number===state.episode?' active':'')+'" data-episode="'+e.number+'">'+e.number+' серия</button>').join('');
  panel.innerHTML=html;
  const activeBtn=panel.querySelector('.episode.active');
  if(activeBtn&&activeBtn.scrollIntoView)activeBtn.scrollIntoView({block:'nearest'});
}

/* ---------- Kodik (запасной вариант, нужен токен на сервере) ---------- */
function renderKodikPlayer(){
  const state=watchState;
  const player=document.getElementById('player');
  const panel=document.querySelector('.episode-panel');
  destroyHls();
  const item=state.items[state.voice];
  const episodes=Array.isArray(item.episodes)?item.episodes:null;
  let link=item.link;
  if(episodes&&episodes.length){
    const ep=episodes.find(e=>String(e.number)===String(state.episode))||episodes[0];
    state.episode=ep.number;
    link=ep.link;
  }
  const url=safeFrameUrl(link);
  if(!url){setPlayerMessage('Kodik вернул некорректную ссылку');return}
  player.innerHTML='<iframe src="'+escapeHtml(url)+'" title="Kodik player" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="width:100%;height:100%;border:0;display:block;background:#050509"></iframe>';
  if(!panel)return;
  let html='<div class="episode-title">Озвучка (Kodik)</div>';
  html+=state.items.map((v,i)=>'<button class="voice'+(i===state.voice?' active':'')+'" data-voice="'+i+'">'+escapeHtml(v.translation)+'</button>').join('');
  if(episodes&&episodes.length){
    html+='<div class="episode-title" style="margin-top:18px">Серии</div>';
    html+=episodes.map(e=>'<button class="episode'+(String(e.number)===String(state.episode)?' active':'')+'" data-episode="'+escapeHtml(e.number)+'">'+escapeHtml(e.number)+' серия</button>').join('');
  }
  panel.innerHTML=html;
}

function bindPanel(){
  const panel=document.querySelector('.episode-panel');
  if(!panel)return;
  panel.onclick=e=>{
    const state=watchState;
    if(!state)return;
    const q=e.target.closest('[data-quality]');
    const ep=e.target.closest('[data-episode]');
    const voice=e.target.closest('[data-voice]');
    if(state.kind==='anilibria'){
      const video=document.getElementById('video');
      if(q){
        const time=video?video.currentTime:0,playing=video&&!video.paused;
        state.quality=Number(q.dataset.quality);
        renderAniLibria({startTime:time,autoplay:playing});
      }else if(ep){
        state.episode=Number(ep.dataset.episode);
        saveProgress(state.episode,0);
        renderAniLibria({autoplay:true});
      }
    }else if(state.kind==='kodik'){
      if(voice){state.voice=Number(voice.dataset.voice)||0;renderKodikPlayer()}
      else if(ep){state.episode=ep.dataset.episode;renderKodikPlayer()}
    }
  };
}

async function fetchJson(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok){const err=new Error('HTTP '+r.status);err.status=r.status;throw err}
  return r.json();
}

/* ---------- AniLibria прямо из браузера (бэкенд не нужен) ---------- */
const LIBRIA_APIS=['https://anilibria.top/api/v1','https://api.anilibria.app/api/v1'];
async function libriaFetch(path){
  let last;
  for(const base of LIBRIA_APIS){
    try{return await fetchJson(base+path)}catch(e){last=e}
  }
  throw last||new Error('AniLibria недоступна');
}
function normTitle(v){return String(v||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-z0-9а-я]+/g,' ').trim()}
function scoreRelease(r,wanted,year){
  const names=[r?.name?.main,r?.name?.english,r?.name?.alternative].map(normTitle).filter(Boolean);
  let score=0;
  for(const w of wanted)for(const n of names){
    if(n===w)score=Math.max(score,10);
    else if(n.length>3&&w.length>3&&(n.includes(w)||w.includes(n)))score=Math.max(score,5);
  }
  if(year&&r?.year){const d=Math.abs(Number(r.year)-Number(year));score+=d===0?3:d===1?1:-6}
  return score;
}
function libriaUrl(u){
  if(!u||typeof u!=='string')return null;
  u=u.trim();if(!u)return null;
  if(/^https?:\/\//i.test(u))return u;
  if(u.startsWith('//'))return 'https:'+u;
  return 'https://anilibria.top'+(u.startsWith('/')?'':'/')+u;
}
function libriaEpisodes(release){
  const range=x=>x&&x.start!=null&&x.stop!=null&&Number(x.stop)>Number(x.start)?{start:Number(x.start),stop:Number(x.stop)}:null;
  return (Array.isArray(release?.episodes)?release.episodes:[]).map((ep,i)=>{
    const hls={480:libriaUrl(ep.hls_480),720:libriaUrl(ep.hls_720),1080:libriaUrl(ep.hls_1080)};
    if(!hls[480]&&!hls[720]&&!hls[1080])return null;
    const p=ep.preview;
    return {number:Number(ep.ordinal)||i+1,title:ep.name||'',hls,opening:range(ep.opening),ending:range(ep.ending),
      preview:libriaUrl(typeof p==='string'?p:(p?.optimized?.src||p?.src||p?.optimized?.preview||p?.preview))};
  }).filter(Boolean).sort((a,b)=>a.number-b.number);
}
// Названия с AniList (romaji/english/синонимы) — по ним AniLibria находит релиз намного точнее
async function aniListTitles(id){
  if(!/^\d+$/.test(String(id||'')))return [];
  try{
    const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
      body:JSON.stringify({query:'query($id:Int){Media(id:$id,type:ANIME){title{romaji english} synonyms}}',variables:{id:Number(id)}})});
    const m=(await r.json())?.data?.Media;
    return m?[m.title?.romaji,m.title?.english,...(m.synonyms||[])].filter(Boolean):[];
  }catch{return []}
}
async function libriaWatch({releaseId,titles,year}){
  if(!releaseId){
    const wanted=[...new Set(titles.map(normTitle).filter(Boolean))];
    const queries=[...new Set(titles.map(t=>String(t).trim()).filter(Boolean))].slice(0,5);
    let best=null;
    for(const q of queries){
      let res;try{res=await libriaFetch('/app/search/releases?query='+encodeURIComponent(q))}catch{continue}
      const list=Array.isArray(res)?res:(Array.isArray(res?.data)?res.data:[]);
      for(const item of list){
        const r=item?.release||item;if(!r?.id)continue;
        const s=scoreRelease(r,wanted,year);
        if(!best||s>best.score)best={id:r.id,score:s};
      }
      if(best&&best.score>=10)break;
    }
    if(!best||best.score<5)return {found:false};
    releaseId=best.id;
  }
  const res=await libriaFetch('/anime/releases/'+encodeURIComponent(releaseId));
  const release=res?.data||res;
  if(!release?.id)return {found:false};
  const alias=release.alias||'';
  return {found:true,episodes:libriaEpisodes(release),release:{id:release.id,title:release.name?.main||'',
    url:alias?'https://anilibria.top/anime/releases/release/'+alias+'/episodes':'https://anilibria.top'}};
}

async function loadVideo(){
  if(!data?.title)return false;
  clearPanel();
  setPlayerMessage('Ищем видео…');

  const isLibria=data.source==='anilibria'||String(data.id||'').startsWith('anilibria-');
  let libriaId=data.anilibriaId||null;
  if(!libriaId&&isLibria)libriaId=String(data.id).replace('anilibria-','');

  let malId=data.malId||null;
  let orig=data.originalTitle||'';
  let alt='';

  // Для аниме из AniList берём оригинальные названия — по ним ищем релиз на AniLibria
  const extraTitles=isLibria?[]:await aniListTitles(data.id);
  if(!orig&&extraTitles[0])orig=extraTitles[0];

  let blockedRelease=null;

  // 1) AniLibria — запрос идёт прямо из браузера, бэкенд и токены не нужны
  try{
    const watch=await libriaWatch({releaseId:libriaId,titles:[orig,...extraTitles,data.title],year:data.year});
    if(watch?.found&&watch.episodes?.length){
      const saved=loadProgress();
      const first=watch.episodes[0].number;
      const startEpisode=saved&&watch.episodes.some(e=>e.number===saved.episode)?saved.episode:first;
      watchState={kind:'anilibria',release:watch.release,episodes:watch.episodes,episode:startEpisode,quality:1080};
      bindPanel();
      renderAniLibria({startTime:saved&&saved.episode===startEpisode?saved.time:0,autoplay:false});
      return true;
    }
    if(watch?.found)blockedRelease=watch.release;
  }catch(e){console.warn('AnimeSpace AniLibria watch error:',e)}

  // 2) Kodik — только если на сервере настроен KODIK_TOKEN
  try{
    const params=new URLSearchParams({type:'kodik'});
    if(malId)params.set('shikimori_id',malId);
    if(orig)params.set('orig',orig);
    if(data.title)params.set('q',data.title);
    if(data.year)params.set('year',data.year);
    const payload=await fetchJson(ANIME_API+'?'+params.toString());
    const items=Array.isArray(payload?.results)?payload.results:[];
    if(items.length){
      watchState={kind:'kodik',items,voice:0,episode:1};
      bindPanel();
      renderKodikPlayer();
      return true;
    }
  }catch(e){
    if(e.status!==503)console.warn('AnimeSpace Kodik error:',e);
  }

  if(blockedRelease){
    setPlayerMessage('Это аниме есть на AniLibria, но показ ограничен правообладателем или регионом.',blockedRelease.url,'Открыть на AniLibria');
  }else{
    setPlayerMessage('Видео для этого аниме не найдено ни в одном источнике.');
  }
  return false;
}

async function init(){
  if(!data&&urlId){
    document.getElementById('title').textContent='Загрузка…';
    try{data=await fetchJson(ANIME_API+'?type=details&id='+encodeURIComponent(urlId))}catch(e){console.warn('AnimeSpace details:',e)}
    if(data)try{localStorage.setItem('selectedAnime',JSON.stringify(data))}catch{}
  }
  if(!data){
    document.getElementById('title').textContent='Аниме не выбрано';
    document.getElementById('description').innerHTML='Откройте аниме из <a href="index.html" style="color:#a78bfa">каталога</a>.';
    setPlayerMessage('Сначала выберите аниме в каталоге');
    return;
  }
  document.title='AnimeSpace — '+(data.title||'Аниме');
  document.getElementById('title').textContent=data.title||'Название аниме';
  document.getElementById('rating').textContent=data.rating||'—';
  document.getElementById('poster').src=data.image||document.getElementById('poster').src;
  document.getElementById('description').textContent=String(data.description||'Описание выбранного аниме появится здесь.').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'');
  document.getElementById('year').textContent=data.year||'—';
  document.getElementById('episodes').textContent=data.episodes?data.episodes+' серий':'—';
  document.getElementById('status').textContent=statusRu(data.status);
  document.getElementById('duration').textContent=data.duration?data.duration+' мин':'—';

  if(Array.isArray(data.genres)&&data.genres.length)
    document.getElementById('genres').innerHTML=data.genres.map(x=>'<span class="genre">'+escapeHtml(x)+'</span>').join('');

  const frameList=Array.isArray(data.frames)?data.frames:(Array.isArray(data.screenshots)?data.screenshots:[]);
  if(frameList.length){
    document.getElementById('frames').hidden=false;
    document.getElementById('framesTitle').hidden=false;
  }
  if(frameList.length)
    document.getElementById('frames').innerHTML=frameList.map((x,i)=>{
      const src=typeof x==='string'?x:x?.image||x?.url||'';
      return src?'<div class="frame"><img src="'+escapeHtml(src)+'" alt="Кадр '+(i+1)+'"></div>':'';
    }).join('');

  // Видео грузим сразу, не дожидаясь проверки входа
  const videoPromise=loadVideo();

  try{
    const{data:{user}}=await client.auth.getUser();
    if(user){
      const key='animeSpaceStatuses:'+user.id;
      let statuses={};
      try{statuses=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
      const saved=statuses[animeKey(data)];
      const select=document.getElementById('watchStatus');
      select.disabled=false;
      select.value=saved?.status||'none';
      select.addEventListener('change',()=>{
        const value=select.value;
        if(value==='none')delete statuses[animeKey(data)];
        else statuses[animeKey(data)]={...data,status:value};
        localStorage.setItem(key,JSON.stringify(statuses));
      });
    }else document.getElementById('watchStatusHint').hidden=false;
  }catch(e){console.warn('AnimeSpace auth:',e);document.getElementById('watchStatusHint').hidden=false}

  await videoPromise;
}
init();
</script></body></html>

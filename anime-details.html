<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080910"><title>AnimeSpace — Аниме</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:#fff}body{background:#080910}.page{min-height:100vh;padding:42px 7%;background:radial-gradient(circle at 50% 0,rgba(139,92,246,.13),transparent 42%),#080910}.details{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:minmax(340px,500px) 1fr;gap:42px;align-items:start}.poster{height:650px;border-radius:20px;overflow:hidden;background:#10111a;border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 35px rgba(139,92,246,.14)}.poster img{width:100%;height:100%;display:block;object-fit:cover}.info{padding:8px 0}.title{font-size:clamp(42px,5vw,76px);line-height:1.02;font-weight:800;letter-spacing:-1.5px;margin:0 0 24px}.meta{display:flex;align-items:stretch;gap:10px;flex-wrap:nowrap;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.meta::-webkit-scrollbar{display:none}.meta-card{flex:0 0 auto;min-width:92px;min-height:68px;padding:11px 13px;border:1px solid rgba(255,255,255,.11);border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.025));box-shadow:0 10px 28px rgba(0,0,0,.24);display:flex;align-items:center;gap:9px}.meta-icon{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(255,59,107,.18),rgba(139,92,246,.22))}.meta-icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.meta-label{display:block;font-size:10px;color:#9297aa;margin-bottom:3px}.meta-value{display:block;font-size:14px;font-weight:750;white-space:nowrap}.description{margin-top:24px;max-width:900px;color:#c7cad6;font-size:16px;line-height:1.7}.section-title{font-size:20px;font-weight:750;margin:34px 0 14px}.genres{display:flex;gap:8px;flex-wrap:wrap}.genre{padding:9px 13px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(255,255,255,.04);color:#bfc3d0;font-size:13px}.frames{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}.frame{flex:0 0 220px;height:125px;border-radius:14px;overflow:hidden;background:#10111a;border:1px solid rgba(255,255,255,.1)}.frame img{width:100%;height:100%;display:block;object-fit:cover}.player{width:100%;margin-top:10px;border-radius:18px;overflow:hidden;background:#050509;border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.4);aspect-ratio:16/9}.player video{width:100%;height:100%;display:block;background:#050509}.player-empty{height:100%;display:flex;align-items:center;justify-content:center;color:#777b8d;font-size:15px}.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:24px;color:#b889ff;text-decoration:none;font-weight:650}.back:hover{color:#fff}.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}@media(max-width:800px){.page{padding:24px 14px}.details{grid-template-columns:1fr;gap:24px}.poster{height:560px;max-width:390px}.title{font-size:42px}.meta{gap:8px}.description{font-size:15px}.frame{flex-basis:190px;height:108px}}@media(max-width:480px){.poster{height:500px}.title{font-size:36px}.meta-card{min-width:86px;padding:10px}.meta-icon{width:30px;height:30px;flex-basis:30px}.frame{flex-basis:160px;height:92px}}</style></head><body><main class="page"><div class="details"><div><a class="back" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Вернуться</a><div class="poster"><img id="poster" src="https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=900&q=85" alt="Постер аниме"></div></div><section class="info"><h1 class="title" id="title">Название аниме</h1><div class="meta"><div class="meta-card"><span class="meta-icon"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg></span><span><span class="meta-label">Оценка</span><span class="meta-value" id="rating">—</span></span></div><div class="meta-card"><span class="meta-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 9h18"/></svg></span><span><span class="meta-label">Год</span><span class="meta-value" id="year">—</span></span></div><div class="meta-card"><span class="meta-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 8v8l7-4-7-4Z"/></svg></span><span><span class="meta-label">Эпизоды</span><span class="meta-value" id="episodes">—</span></span></div><div class="meta-card"><span class="meta-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg></span><span><span class="meta-label">Статус</span><span class="meta-value" id="status">—</span></span></div><div class="meta-card"><span class="meta-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span><span class="meta-label">Длительность</span><span class="meta-value" id="duration">—</span></span></div></div><h2 class="section-title">Описание</h2><p class="description" id="description">Здесь будет описание выбранного аниме.</p><h2 class="section-title">Жанры</h2><div class="genres" id="genres"><span class="genre">Аниме</span></div><h2 class="section-title">Кадры из аниме</h2><div class="frames" id="frames"></div><h2 class="section-title">Просмотр</h2><div class="player" id="player"><div class="player-empty">Видео будет доступно после подключения источника серии</div></div></section></div></main><script>const data=JSON.parse(localStorage.getItem('selectedAnime')||'null');if(data){document.getElementById('title').textContent=data.title||'Название аниме';document.getElementById('rating').textContent=data.rating||'—';document.getElementById('poster').src=data.image||document.getElementById('poster').src;document.getElementById('description').textContent=data.description||'Описание выбранного аниме появится здесь.';document.getElementById('year').textContent=data.year||'—';document.getElementById('episodes').textContent=data.episodes?data.episodes+' серий':'—';document.getElementById('status').textContent=data.status||'—';document.getElementById('duration').textContent=data.duration||'—';if(Array.isArray(data.genres)&&data.genres.length)document.getElementById('genres').innerHTML=data.genres.map(x=>'<span class="genre">'+String(x).replace(/[&<>]/g,'')+'</span>').join('');const frameList=Array.isArray(data.frames)?data.frames:(Array.isArray(data.screenshots)?data.screenshots:[]);if(frameList.length){document.getElementById('frames').innerHTML=frameList.map((x,i)=>{const src=typeof x==='string'?x:x?.image||x?.url||'';return src?'<div class="frame"><img src="'+String(src).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'" alt="Кадр '+(i+1)+'"></div>':''}).join('')}const video=data.videoUrl||data.video||data.episodeUrl;if(video){document.getElementById('player').innerHTML='<video controls playsinline preload="metadata" src="'+String(video).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'"></video>'}}</script></body></html>

<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeSpace — Топ 100</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="logo-link" href="index.html"><img class="logo" src="image.png" alt="AnimeSpace"></a><nav class="nav"><a href="index.html"><span class="icon">⌂</span>Главное</a><a href="schedule.html"><span class="icon">▣</span>Расписание</a><a class="active" href="top100.html"><span class="icon">↗</span>Топ 100</a><a href="search.html"><span class="icon">⌕</span>Поиск</a><a href="profile.html"><span class="icon">♙</span>Профиль</a></nav></header><main class="page"><div class="page-inner"><div class="top-heading"><h1 class="page-title">Топ 100</h1><div class="top-tabs"><button class="top-tab active">Общий топ</button><button class="top-tab">Лучшее за год</button><button class="top-tab">Лучшее за сезон</button><button class="top-tab">Популярное</button></div></div><section class="podium" id="podium"></section><section class="top-grid" id="topGrid"></section></div></main><script src="app.js"></script><script>const imgs=images;function makeTop(i){const anime={title:'Аниме из топа '+i,rating:(10-(i-1)*.025).toFixed(1),image:imgs[(i-1)%imgs.length]};return `<article class="top-card" data-anime='${encodeURIComponent(JSON.stringify(anime))}'><img src="${anime.image}" alt="${esc(anime.title)}" loading="lazy"><div class="top-info"><div class="top-rank">#${i}</div><div class="top-name">${esc(anime.title)}</div><div class="top-rating">★ ${anime.rating}</div><div class="top-meta">24 эпизода · Завершено</div></div></article>`}for(let i=1;i<=3;i++)document.getElementById('podium').innerHTML+=makeTop(i);for(let i=4;i<=100;i++)document.getElementById('topGrid').innerHTML+=makeTop(i);document.querySelectorAll('.top-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.top-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')})</script></body></html>

<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080910"><title>AnimeSpace — Топ 100</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:#fff}body{background:#080910}.topbar{height:92px;display:flex;align-items:center;padding:0 20px;background:linear-gradient(180deg,rgba(24,24,38,.58),rgba(10,10,17,.38));backdrop-filter:blur(42px) saturate(190%);-webkit-backdrop-filter:blur(42px) saturate(190%);border-bottom:1px solid rgba(255,255,255,.2);box-shadow:0 12px 45px rgba(0,0,0,.42),0 1px 28px rgba(139,92,246,.34);position:relative;overflow:hidden}.topbar:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,#ff3b6b,rgba(255,255,255,.25),#8b5cf6,rgba(255,255,255,.25),#ff3b6b)}.logo-link{width:390px;height:100%;display:flex;align-items:center;margin-left:-32px;z-index:2}.logo{width:350px;height:78px;object-fit:contain}.nav{position:absolute;left:390px;right:0;top:0;height:100%;display:flex}.nav a{flex:1;border:0;background:transparent;color:#aeb2c1;font-size:16px;font-weight:600;text-decoration:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;position:relative}.nav a:hover,.nav a.active{color:#fff;background:rgba(255,255,255,.04)}.nav a.active:after{content:"";position:absolute;left:16%;right:16%;bottom:0;height:3px;background:linear-gradient(90deg,#ff3b6b,#8b5cf6);box-shadow:0 0 12px #8b5cf6}.icon{width:21px;height:21px}.icon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8}.content{padding:38px 3% 50px}.heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.title{font-size:30px;font-weight:750;margin:0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:9px 14px;background:rgba(255,255,255,.04);color:#aeb2c1;font-size:13px;cursor:pointer}.tab.active,.tab:hover{color:#fff;border-color:#8b5cf6;background:linear-gradient(135deg,rgba(255,59,107,.18),rgba(139,92,246,.2))}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-bottom:2px}.podium .card{height:430px}.top-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0}.card{height:360px;position:relative;overflow:hidden;background:#10111a;transition:transform .2s,filter .2s}.card img{width:100%;height:100%;object-fit:cover;display:block}.info{position:absolute;left:0;right:0;bottom:0;padding:55px 14px 14px;background:linear-gradient(transparent,rgba(0,0,0,.94))}.rank{font-size:13px;color:#b889ff;margin-bottom:4px}.name{font-size:16px;font-weight:700}.rating{margin-top:5px;font-size:13px;color:#d8dbe8}.meta{margin-top:4px;font-size:11px;color:#999dad}.card:hover{filter:brightness(1.08);transform:scale(1.015);z-index:2}.podium .card:nth-child(1){order:2}.podium .card:nth-child(2){order:1}.podium .card:nth-child(3){order:3}.podium .rank{font-size:17px}.podium .name{font-size:19px}.podium .rating{font-size:14px}@media(max-width:1100px){.logo-link{width:330px}.logo{width:300px}.nav{left:330px}.top-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.podium .card{height:390px}}@media(max-width:700px){.topbar{height:76px}.logo-link{width:230px;margin-left:-18px}.logo{width:220px;height:64px}.nav{left:230px;min-width:610px}.nav a{font-size:13px}.content{padding:24px 12px}.heading{display:block}.title{font-size:25px;margin-bottom:16px}.tabs{overflow:auto;flex-wrap:nowrap;padding-bottom:3px}.tab{white-space:nowrap}.podium{grid-template-columns:repeat(3,1fr)}.podium .card{height:270px}.podium .name{font-size:13px}.podium .rank{font-size:11px}.top-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.card{height:300px}.name{font-size:14px}.rank{font-size:11px}.meta{font-size:10px}}</style></head><body><header class="topbar"><a class="logo-link" href="index.html"><img class="logo" src="image.png" alt="AnimeSpace"></a><nav class="nav"><a href="index.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8M5.5 9.5V21h13V9.5M9.5 21v-6h5v6"/></svg></span>Главное</a><a href="index.html"><span class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span>Расписание</a><a class="active" href="top100.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 17 9 12l4 3 7-8M17 7h3v3M4 20h16"/></svg></span>Топ 100</a><a href="index.html"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></span>Поиск</a><a href="index.html"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c.7-4 3.1-6 7-6s6.3 2 7 6"/></svg></span>Профиль</a></nav></header><main class="content"><div class="heading"><h1 class="title">Топ 100</h1><div class="tabs"><button class="tab active">Общий топ</button><button class="tab">Лучшее за год</button><button class="tab">Лучшее за сезон</button><button class="tab">Популярное</button></div></div><section class="podium" id="podium"></section><section class="top-grid" id="topGrid"></section></main><script>const images=['https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=700&q=80','https://images.unsplash.com/photo-1560972550-aba3456b5564?auto=format&fit=crop&w=700&q=80','https://images.unsplash.com/photo-1613376023733-0a73315d9b06?auto=format&fit=crop&w=700&q=80','https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=700&q=80','https://images.unsplash.com/photo-1618336753974-aae8e04506aa?auto=format&fit=crop&w=700&q=80','https://images.unsplash.com/photo-1635805737707-575885ab0820?auto=format&fit=crop&w=700&q=80'];function makeCard(i,podium=false){const card=document.createElement('article');card.className='card';const rating=(10-(i-1)*0.025).toFixed(1);card.innerHTML='<img src="'+images[(i-1)%images.length]+'" alt=""><div class="info"><div class="rank">#'+i+'</div><div class="name">Аниме из топа '+i+'</div><div class="rating">★ '+rating+'</div><div class="meta">24 эпизода · Завершено</div></div>';return card}const podium=document.getElementById('podium');[1,2,3].forEach(i=>podium.appendChild(makeCard(i,true)));const grid=document.getElementById('topGrid');for(let i=4;i<=100;i++)grid.appendChild(makeCard(i));document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));tab.classList.add('active')}));</script></body></html>

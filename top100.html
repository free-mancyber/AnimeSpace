<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080910"><title>AnimeSpace — Топ 100</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:#fff}body{background:#080910}.topbar{height:92px;display:flex;align-items:center;padding:0 20px;background:linear-gradient(180deg,rgba(24,24,38,.58),rgba(10,10,17,.38));backdrop-filter:blur(42px) saturate(190%);-webkit-backdrop-filter:blur(42px) saturate(190%);border-bottom:1px solid rgba(255,255,255,.2);box-shadow:0 12px 45px rgba(0,0,0,.42),0 1px 28px rgba(139,92,246,.34);position:relative;overflow:hidden}.topbar:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,#ff3b6b,rgba(255,255,255,.25),#8b5cf6,rgba(255,255,255,.25),#ff3b6b)}.logo-link{width:440px;height:100%;display:flex;align-items:center;margin-left:-32px}.logo{width:390px;height:84px;object-fit:contain}.content{padding:38px 3% 50px}.title{font-size:30px;font-weight:750;margin:0 0 24px}.top-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0}.card{height:360px;position:relative;overflow:hidden;background:#10111a}.card img{width:100%;height:100%;object-fit:cover;display:block}.info{position:absolute;left:0;right:0;bottom:0;padding:48px 14px 14px;background:linear-gradient(transparent,rgba(0,0,0,.94))}.rank{font-size:13px;color:#b889ff;margin-bottom:4px}.name{font-size:16px;font-weight:700}.rating{margin-top:5px;font-size:13px;color:#d8dbe8}.card:hover{filter:brightness(1.08);transform:scale(1.015);z-index:2}@media(max-width:1100px){.top-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:700px){.topbar{height:76px}.logo-link{width:310px}.logo{width:270px;height:68px}.content{padding:24px 12px}.title{font-size:25px}.top-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.card{height:300px}.name{font-size:14px}.rank{font-size:11px}}</style></head><body><header class="topbar"><a class="logo-link" href="index.html"><img class="logo" src="image.png" alt="AnimeSpace"></a></header><main class="content"><h1 class="title">Топ 100</h1><div class="top-grid" id="topGrid"></div></main><script>const images=['https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=700&q=80','https://images.unsplash.com/photo-1560972550-aba3456b5564?auto=format&fit=crop&w=700&q=80','https://images.unsplash.com/photo-1613376023733-0a73315d9b06?auto=format&fit=crop&w=700&q=80','https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=700&q=80','https://images.unsplash.com/photo-1618336753974-aae8e04506aa?auto=format&fit=crop&w=700&q=80','https://images.unsplash.com/photo-1635805737707-575885ab0820?auto=format&fit=crop&w=700&q=80'];const grid=document.getElementById('topGrid');for(let i=1;i<=100;i++){const card=document.createElement('article');card.className='card';const rating=(10-(i-1)*0.025).toFixed(1);card.innerHTML='<img src="'+images[(i-1)%images.length]+'" alt=""><div class="info"><div class="rank">#'+i+'</div><div class="name">Аниме из топа '+i+'</div><div class="rating">★ '+rating+'</div></div>';grid.appendChild(card)}</script></body></html>

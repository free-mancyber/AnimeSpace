<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnimeSpace — тест Shikimori API</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080910;color:#fff;font-family:Inter,Arial,sans-serif;padding:30px}
.wrap{max-width:1100px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}
h1{margin:0;font-size:28px}.sub{color:#9fa3b5;margin-top:6px}
button{border:0;border-radius:12px;padding:12px 18px;background:linear-gradient(90deg,#ff3b6b,#8b5cf6);color:#fff;font-weight:700;cursor:pointer}
#status{margin:18px 0;color:#b889ff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{overflow:hidden;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(255,255,255,.04)}
.card img{width:100%;height:330px;object-fit:cover;display:block}.info{padding:14px}.name{font-size:17px;font-weight:700}.meta{margin-top:7px;color:#aeb2c1;font-size:13px}.desc{margin-top:9px;color:#9fa3b5;font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){body{padding:18px}.head{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>Тест Shikimori API</h1><div class="sub">AnimeSpace получает реальные данные об аниме</div></div>
    <button onclick="loadAnime()">Загрузить аниме</button>
  </div>
  <div id="status">Нажми «Загрузить аниме» для проверки API.</div>
  <div class="grid" id="grid"></div>
</div>
<script>
const API='https://shikimori.one/api/animes?search=Naruto&limit=6';
const grid=document.getElementById('grid');
const status=document.getElementById('status');

async function loadAnime(){
  status.textContent='Загрузка данных из Shikimori...';
  grid.innerHTML='';
  try{
    const response=await fetch(API,{headers:{Accept:'application/json'}});
    if(!response.ok) throw new Error('HTTP '+response.status);
    const data=await response.json();
    if(!Array.isArray(data)||!data.length) throw new Error('API вернул пустой результат');
    status.textContent='API работает. Получено: '+data.length+' аниме.';
    grid.innerHTML=data.map(anime=>{
      const image=anime.image?.original?('https://shikimori.one'+anime.image.original):'';
      const title=anime.russian||anime.name||'Без названия';
      const type=anime.kind||'—';
      const score=anime.score||'—';
      const episodes=anime.episodes||'—';
      const desc=(anime.description||'Описание отсутствует').replace(/\[[^\]]+\]/g,'');
      return `<article class="card"><img src="${image}" alt="${escapeHtml(title)}"><div class="info"><div class="name">${escapeHtml(title)}</div><div class="meta">Рейтинг: ★ ${escapeHtml(String(score))} · Эпизоды: ${escapeHtml(String(episodes))} · ${escapeHtml(type)}</div><div class="desc">${escapeHtml(desc)}</div></div></article>`;
    }).join('');
  }catch(error){
    status.textContent='Ошибка подключения: '+error.message;
  }
}
function escapeHtml(value){return value.replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));}
</script>
</body>
</html>

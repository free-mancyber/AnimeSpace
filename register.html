<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#080910"><title>AnimeSpace — Регистрация</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:#fff}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,rgba(5,6,14,.82),rgba(18,8,31,.72)),radial-gradient(circle at 80% 20%,#6941c655,transparent 35%),#080910;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 0 45%,rgba(255,255,255,.025) 50%,transparent 55%)}.wrap{width:min(100%,620px);position:relative;z-index:1}.card{position:relative;padding:34px 38px;border:1px solid rgba(255,255,255,.18);border-radius:38px;background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.035));backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 25px 80px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.14),0 0 35px rgba(139,92,246,.10);overflow:hidden}.card:before{content:"";position:absolute;left:8%;right:8%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);opacity:.7}.brand{display:flex;align-items:center;justify-content:center;margin-bottom:20px}.logo{width:560px;height:170px;max-width:100%;display:block;object-fit:contain;border-radius:0;background:transparent;box-shadow:none;filter:none}h1{margin:0;font-size:34px;line-height:1.1;letter-spacing:-1px;text-align:center}form{display:grid;margin-top:20px}label{display:block;margin:12px 0 7px;font-size:13px;color:#d9dce7;font-weight:600}input{width:100%;padding:15px 18px;border-radius:22px;border:1px solid rgba(255,255,255,.13);background:rgba(7,8,17,.48);color:#fff;outline:none;font-size:15px;transition:.2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}input::placeholder{color:#62697b}input:focus{border-color:#8b5cf6;box-shadow:0 0 0 4px rgba(139,92,246,.12),inset 0 1px 0 rgba(255,255,255,.06)}.btn{width:100%;margin-top:22px;padding:16px;border:0;border-radius:22px;background:linear-gradient(135deg,#8b5cf6,#6657f5);color:#fff;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 12px 28px rgba(105,80,245,.28);transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.btn:disabled{opacity:.65;cursor:wait;transform:none}.login{text-align:center;color:#858c9f;margin:18px 0 0;font-size:14px}.login a{color:#b39cff;text-decoration:none;font-weight:700}.error{text-align:center;color:#ff8d9d;font-size:14px;min-height:20px;margin:12px 0 0}@media(max-width:520px){body{padding:14px}.card{padding:27px 20px;border-radius:30px}.logo{width:100%;height:145px}h1{font-size:29px}}
</style></head>
<body><main class="wrap"><section class="card"><div class="brand"><img class="logo" src="image.png" alt="AnimeSpace"></div><h1>Создать аккаунт</h1><form id="registerForm"><label for="name">Никнейм</label><input id="name" placeholder="Твой никнейм" autocomplete="username" required><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email" required><label for="password">Пароль</label><input id="password" type="password" placeholder="Введите пароль" autocomplete="new-password" required><label for="password2">Повторите пароль</label><input id="password2" type="password" placeholder="Повторите пароль" autocomplete="new-password" required><button class="btn" id="submitBtn" type="submit">Создать аккаунт</button><div class="error" id="error"></div></form><p class="login">Уже есть аккаунт? <a href="login.html">Войти</a></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://vbxjvwssjafcfbmqrqow.supabase.co';
const SUPABASE_KEY='sb_publishable__5mPBElGBo1GFn7Yd0n4Ng_1i28p6aE';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const form=document.getElementById('registerForm');
const error=document.getElementById('error');
const btn=document.getElementById('submitBtn');
form.addEventListener('submit',async e=>{
 e.preventDefault();
 error.textContent='';
 const name=document.getElementById('name').value.trim();
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const password2=document.getElementById('password2').value;
 if(password!==password2){error.textContent='Пароли не совпадают';return}
 if(password.length<6){error.textContent='Пароль должен содержать минимум 6 символов';return}
 btn.disabled=true;
 btn.textContent='Создаём аккаунт…';
 const {data,error:signUpError}=await supabaseClient.auth.signUp({
   email,
   password,
   options:{
     data:{nickname:name},
     emailRedirectTo:'https://free-mancyber.github.io/AnimeSpace/'
   }
 });
 if(signUpError){
   error.textContent=signUpError.message;
   btn.disabled=false;
   btn.textContent='Создать аккаунт';
   return;
 }
 localStorage.setItem('animeSpacePendingEmail',email);
 localStorage.setItem('animeSpacePendingNickname',name);
 window.location.href='waiting.html';
});
</script></body></html>

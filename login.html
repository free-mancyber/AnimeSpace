<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080910"><title>AnimeSpace — Вход</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:#fff}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,rgba(5,6,14,.82),rgba(18,8,31,.72)),radial-gradient(circle at 80% 20%,#6941c655,transparent 35%),#080910;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 0 45%,rgba(255,255,255,.025) 50%,transparent 55%)}.wrap{width:min(100%,620px);position:relative;z-index:1}.card{padding:32px 38px;border:1px solid rgba(255,255,255,.12);border-radius:26px;background:rgba(14,15,25,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 30px 90px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.06)}.brand{display:flex;align-items:center;justify-content:center;margin-bottom:20px}.logo{width:560px;height:170px;max-width:100%;border-radius:0;display:block;object-fit:contain;background:transparent;box-shadow:none;filter:none}h1{margin:0;font-size:34px;line-height:1.1;letter-spacing:-1px;text-align:center}form{display:grid;margin-top:20px}label{display:block;margin:12px 0 7px;font-size:13px;color:#d9dce7;font-weight:600}input{width:100%;padding:14px;border-radius:13px;border:1px solid rgba(255,255,255,.11);background:rgba(5,7,14,.65);color:#fff;outline:none;font-size:15px;transition:.2s}input::placeholder{color:#62697b}input:focus{border-color:#8b5cf6;box-shadow:0 0 0 4px rgba(139,92,246,.12)}.btn{width:100%;margin-top:22px;padding:15px;border:0;border-radius:13px;background:linear-gradient(135deg,#8b5cf6,#6657f5);color:#fff;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 12px 28px rgba(105,80,245,.28);transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.login{text-align:center;color:#858c9f;margin:18px 0 0;font-size:14px}.login a{color:#b39cff;text-decoration:none;font-weight:700}@media(max-width:520px){body{padding:14px}.card{padding:26px 20px;border-radius:24px}.logo{width:100%;height:145px}h1{font-size:29px}}
</style></head>
<body><main class="wrap"><section class="card"><div class="brand"><img class="logo" src="AnimeSpace_logo_transparent.png" alt="AnimeSpace"></div><h1>Войти</h1><form onsubmit="event.preventDefault();alert('Демо: авторизация будет подключена позже.');"><label for="login">Email или никнейм</label><input id="login" type="text" placeholder="Введите email или никнейм" autocomplete="username" required><label for="password">Пароль</label><input id="password" type="password" placeholder="Введите пароль" autocomplete="current-password" required><button class="btn" type="submit">Войти</button></form><p class="login">Нет аккаунта? <a href="register.html">Создать аккаунт</a></p></section></main></body></html>

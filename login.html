<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnimeSpace — Вход</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 20%,#30205c 0,transparent 35%),radial-gradient(circle at 80% 80%,#24184a 0,transparent 35%),#090812;color:#fff;font-family:Arial,sans-serif}.wrap{width:min(100%,620px);padding:20px}.card{padding:32px 38px;background:rgba(20,18,34,.82);border:1px solid rgba(255,255,255,.12);border-radius:26px;box-shadow:0 20px 70px rgba(0,0,0,.45);backdrop-filter:blur(18px)}.brand{text-align:center;margin-bottom:18px}.logo{width:560px;height:145px;max-width:100%;display:block;margin:auto;object-fit:contain}h1{text-align:center;font-size:34px;margin:0 0 26px}label{display:block;margin:0 0 8px;font-size:14px;color:#bbb5cf}.field{margin-bottom:17px}input{width:100%;padding:15px 16px;border-radius:13px;border:1px solid #3a354c;background:#12101d;color:#fff;font-size:16px;outline:none}input:focus{border-color:#9b6cff;box-shadow:0 0 0 3px rgba(155,108,255,.12)}button{width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(135deg,#8d5cff,#c05cff);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:5px}button:hover{filter:brightness(1.08)}.links{text-align:center;margin-top:20px;color:#aaa4bb;font-size:14px}.links a{color:#b889ff;text-decoration:none}.links a:hover{text-decoration:underline}@media(max-width:520px){.card{padding:25px 22px}.logo{height:120px}h1{font-size:29px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="brand"><img class="logo" src="AnimeSpace_logo_transparent.png" alt="AnimeSpace"></div>
<h1>Войти</h1>
<form onsubmit="event.preventDefault();alert('Демо: авторизация будет подключена позже.');">
<div class="field"><label for="login">Email или никнейм</label><input id="login" type="text" placeholder="Введите email или никнейм" required></div>
<div class="field"><label for="password">Пароль</label><input id="password" type="password" placeholder="Введите пароль" required></div>
<button type="submit">Войти</button>
</form>
<div class="links">Нет аккаунта? <a href="register.html">Создать аккаунт</a><br><a href="index.html">← На главную</a></div>
</div></div>
</body>
</html>

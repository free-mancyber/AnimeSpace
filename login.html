<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080910"><title>AnimeSpace — Вход</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:#fff}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,rgba(5,6,14,.82),rgba(18,8,31,.72)),radial-gradient(circle at 80% 20%,#6941c655,transparent 35%),#080910;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 0 45%,rgba(255,255,255,.025) 50%,transparent 55%)}.wrap{width:min(100%,620px);position:relative;z-index:1}.card{padding:32px 38px;background:rgba(20,18,34,.82);border:1px solid rgba(255,255,255,.12);border-radius:26px;box-shadow:0 20px 70px rgba(0,0,0,.45);backdrop-filter:blur(18px)}.brand{text-align:center;margin-bottom:18px}.logo{width:560px;height:145px;max-width:100%;display:block;margin:auto;object-fit:contain;border-radius:0;background:transparent;box-shadow:none;filter:none}h1{text-align:center;font-size:34px;margin:0 0 26px;line-height:1.1;letter-spacing:-1px}form{display:grid}label{display:block;margin:0 0 8px;font-size:14px;color:#bbb5cf}.field{margin-bottom:17px}input{width:100%;padding:15px 16px;border-radius:13px;border:1px solid #3a354c;background:#12101d;color:#fff;font-size:16px;outline:none}input:focus{border-color:#9b6cff;box-shadow:0 0 0 3px rgba(155,108,255,.12)}input::placeholder{color:#62697b}.btn{width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(135deg,#8d5cff,#c05cff);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:5px}.btn:hover{filter:brightness(1.08)}.login{text-align:center;margin-top:20px;color:#aaa4bb;font-size:14px}.login a{color:#b889ff;text-decoration:none}.login a:hover{text-decoration:underline}@media(max-width:520px){.card{padding:25px 22px}.logo{height:120px}h1{font-size:29px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="brand"><img class="logo" src="image.png" alt="AnimeSpace"></div>
<h1>Войти</h1>
<form onsubmit="event.preventDefault();alert('Демо: авторизация будет подключена позже.');">
<div class="field"><label for="login">Email или никнейм</label><input id="login" type="text" placeholder="Введите email или никнейм" autocomplete="off" required></div>
<div class="field"><label for="password">Пароль</label><input id="password" type="password" placeholder="Введите пароль" autocomplete="new-password" required></div>
<button class="btn" type="submit">Войти</button>
</form>
<p class="login">Нет аккаунта? <a href="register.html">Создать аккаунт</a></p>
</div></div>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#080910"><title>AnimeSpace — Подтверждение</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:#fff}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,rgba(5,6,14,.82),rgba(18,8,31,.72)),radial-gradient(circle at 80% 20%,#6941c655,transparent 35%),#080910;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 0 45%,rgba(255,255,255,.025) 50%,transparent 55%)}.wrap{width:min(100%,620px);position:relative;z-index:1}.card{position:relative;padding:34px 38px;border:1px solid rgba(255,255,255,.18);border-radius:38px;background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.035));backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 25px 80px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.14),0 0 35px rgba(139,92,246,.10);overflow:hidden}.card:before{content:"";position:absolute;left:8%;right:8%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);opacity:.7}.brand{display:flex;align-items:center;justify-content:center;margin-bottom:20px}.logo{width:560px;height:170px;max-width:100%;display:block;object-fit:contain;border-radius:0;background:transparent;box-shadow:none;filter:none}h1{margin:0;font-size:34px;line-height:1.1;letter-spacing:-1px;text-align:center}.text{text-align:center;color:#9da3b5;font-size:14px;line-height:1.6;margin:14px 0 24px}.email{color:#fff;font-weight:700;word-break:break-word}.code{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.code input{width:100%;height:58px;border-radius:18px;border:1px solid rgba(255,255,255,.13);background:rgba(7,8,17,.48);color:#fff;outline:none;text-align:center;font-size:23px;font-weight:700;transition:.2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}.code input:focus{border-color:#8b5cf6;box-shadow:0 0 0 4px rgba(139,92,246,.12),inset 0 1px 0 rgba(255,255,255,.06)}.btn{width:100%;margin-top:22px;padding:16px;border:0;border-radius:22px;background:linear-gradient(135deg,#8b5cf6,#6657f5);color:#fff;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 12px 28px rgba(105,80,245,.28);transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.resend{text-align:center;margin:18px 0 0;color:#858c9f;font-size:14px}.resend button{border:0;background:none;color:#b39cff;text-decoration:none;font-weight:700;cursor:pointer;font-size:14px}.back{text-align:center;margin:14px 0 0}.back a{color:#858c9f;text-decoration:none;font-size:14px}.back a:hover{color:#fff}@media(max-width:520px){body{padding:14px}.card{padding:27px 20px;border-radius:30px}.logo{width:100%;height:145px}h1{font-size:29px}.code{gap:6px}.code input{height:52px;border-radius:15px;font-size:20px}}
</style></head>
<body><main class="wrap"><section class="card"><div class="brand"><img class="logo" src="image.png" alt="AnimeSpace"></div><h1>Подтвердите почту</h1><p class="text">Мы отправили код подтверждения на<br><span class="email" id="email">you@example.com</span></p><div class="code"><input maxlength="1" inputmode="numeric" autocomplete="one-time-code"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"></div><button class="btn" type="button">Подтвердить</button><p class="resend">Не пришёл код? <button type="button">Отправить снова</button></p><div class="back"><a href="register.html">← Назад</a></div></section></main><script>const inputs=[...document.querySelectorAll('.code input')];inputs.forEach((input,i)=>{input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,1);if(input.value&&i<inputs.length-1)inputs[i+1].focus()});input.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!input.value&&i>0)inputs[i-1].focus()});input.addEventListener('paste',e=>{e.preventDefault();const value=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);value.split('').forEach((v,j)=>{if(inputs[j])inputs[j].value=v});inputs[Math.min(value.length,inputs.length-1)].focus()})});</script></body></html>
